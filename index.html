    { id:"c4", label:"OUT",      color:"#D97706", icon:"🚗" },
  ]);

  const [settings, setSettings] = useState({ weekStartsOn: 0, reminderDays: 3 });
  const [showSettings, setShowSettings] = useState(false);

  // ── Firebase認証の監視 ──
  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(user => {
      setAuthUser(user);
      setAuthReady(true);
      if (!user) setDataLoaded(false);
    });
    return unsub;
  }, []);

  // ── Firestoreからデータをロード（ログイン時） ──
  useEffect(() => {
    if (!authUser) return;
    const db = firebase.firestore();
    db.doc(`users/${authUser.uid}/data/main`).get().then(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (Array.isArray(d.tasks))      setTasks(d.tasks);
        if (Array.isArray(d.events))     setEvents(d.events);
        if (Array.isArray(d.projects))   setProjects(d.projects);
        if (Array.isArray(d.companies))  setCompanies(d.companies);
        if (Array.isArray(d.checklists)) setChecklists(d.checklists);
        if (Array.isArray(d.eventCats))  setEventCats(d.eventCats);
        if (d.settings)      setSettings(s => ({...s, ...d.settings}));
        if (d.notifSettings) setNotifSettings(s => ({...s, ...d.notifSettings}));
        // colOrder（スプレッドシート列順）
        if (d.colOrder !== undefined) {
          try { localStorage.setItem("sz_colOrder", JSON.stringify(d.colOrder)); } catch(e) {}
        }
      }
      setDataLoaded(true);
    }).catch(err => {
      console.error("Firestore load error:", err);
      setDataLoaded(true);
    });
  }, [authUser?.uid]);

  // ── Firestoreへ保存（各データ変更時、debounce 1.5秒） ──
  const scheduleFirestoreSave = (patch) => {
    if (!authUser) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      firebase.firestore().doc(`users/${authUser.uid}/data/main`).set(patch, { merge: true });
    }, 1500);
  };

  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ tasks }); },       [tasks]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ events }); },      [events]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ projects }); },    [projects]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ companies }); },   [companies]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ checklists }); },  [checklists]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ eventCats }); },   [eventCats]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ settings }); },    [settings]);
  useEffect(() => { if (dataLoaded && authUser) scheduleFirestoreSave({ notifSettings });}, [notifSettings]);

  const [notifPerm,    setNotifPerm]   = useState(typeof Notification!=="undefined"?Notification.permission:"denied");
  const [notifSettings,setNotifSettings] = useState({
    morning: true,
    morningTime: "09:30",
    morningDays: [1,2,3,4,5],
    before: true,
    beforeMin: 15,
    overdue: true,
    overdueRepeat: "hourly",
    taskNotifs: {},
  });
  const notifFired = useRef(new Set());

  // modal state
  const [taskMdl,  setTaskMdl]  = useState(null);
  const [eventMdl, setEventMdl] = useState(null); // null | event object
  const [projMdl,  setProjMdl]  = useState(null); // null | project object

  // ── task CRUD ──
  const saveTask = t => {
    if (t.id) {
      // editing: update this and all future repeats that share _repeatBase
      const base = t._repeatBase || t.id;
      setTasks(ts => {
        // remove old repeat instances of this base (except ones before original date)
        const filtered = ts.filter(x => x._repeatBase !== base && x.id !== t.id);
        const expanded = expandRepeat({...t, id:base, _repeatBase:undefined, _repeatIdx:undefined});
        return [...filtered, ...expanded.map(x=>({...x, done:false}))];
      });
    } else {
      const newId = Date.now();
      const expanded = expandRepeat({...t, id:newId});
      setTasks(ts => [...ts, ...expanded.map(x=>({...x, done:false}))]);
    }
    setTaskMdl(null);
  };
  const deleteTask = (id, deleteAll=true) => {
    setTasks(ts => {
      const target = ts.find(t => t.id===id);
      const base = target?._repeatBase || id;
      if (deleteAll && target?._repeatBase) {
        // delete all repeats
        return ts.filter(t => t._repeatBase!==base && t.id!==base);
      }
      return ts.filter(t => t.id!==id);
    });
    setTaskMdl(null);
  };
  const toggleDone = id => {
    const t = tasks.find(x=>x.id===id);
    const newDone = t ? !t.done : true;
    setTasks(ts => ts.map(x => x.id===id ? {...x,done:newDone} : x));
    // チェックシートタスクの場合checkDoneも連動
    if(t?._fromChecklist){
      setEvents(prev=>prev.map(ev=>{
        const ids=ev.checklistIds||(ev.checklist?[ev.checklist]:[]);
        for(const clId of ids){
          const taskMap=ev.checkTaskIds?.[clId];
          if(!taskMap) continue;
          const idx=Object.keys(taskMap).find(i=>taskMap[i]===id);
          if(idx!==undefined){
            return {...ev,checkDone:{...(ev.checkDone||{}),[clId]:{...(ev.checkDone?.[clId]||{}),[idx]:newDone}}};
          }
        }
        return ev;
      }));
    }
  };

  // ── event CRUD ──
  const saveEvent = ev => {
    if (ev.id) {
      const base = ev._repeatBase || ev.id;
      setEvents(es => {
        const filtered = es.filter(x => x._repeatBase !== base && x.id !== ev.id);
        const expanded = expandRepeat({...ev, id:base, _repeatBase:undefined, _repeatIdx:undefined});
        return [...filtered, ...expanded];
      });
    } else {
      const newId = "ev"+Date.now();
      const expanded = expandRepeat({...ev, id:newId});
      setEvents(es => [...es, ...expanded]);
    }
    setEventMdl(null);
  };
  const deleteEvent = (id, deleteAll=true) => {
    setEvents(es => {
      const target = es.find(e => e.id===id);
      const base = target?._repeatBase || id;
      if (deleteAll && target?._repeatBase) {
        return es.filter(e => e._repeatBase!==base && e.id!==base);
      }
      return es.filter(e => e.id!==id);
    });
    setEventMdl(null);
  };

  // ── project CRUD ──
  const saveProject = p => {
    if (p.id) setProjects(ps => ps.map(x => x.id===p.id ? p : x));
    else      setProjects(ps => [...ps, {...p, id:"p"+Date.now(), progress:0}]);
    setProjMdl(null);
  };
  const deleteProject = id => { setProjects(ps => ps.filter(p => p.id!==id)); setProjMdl(null); };


    // ── Desktop notifications ──
  const requestNotifPerm = async () => {
    if(typeof Notification==="undefined") return;
    const p = await Notification.requestPermission();
    setNotifPerm(p);
    if(p==="granted"){
      new Notification("✅ タスク管理ツール 通知が有効になりました", {body:"タスクの通知が届くようになります"});
    }
  };
  const sendNotif = (title, body) => {
    if(notifPerm==="granted") new Notification(title,{body,icon:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white'%3ETH%3C/text%3E%3C/svg%3E"});
  };
  useEffect(() => {
    const tick = setInterval(() => {
      if(notifPerm!=="granted") return;
      const now = new Date();
      const todayStr = now.toISOString().slice(0,10);
      const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const nowMin = now.getHours()*60+now.getMinutes();

      // morning digest — respect morningDays
      const todayDow = new Date(todayStr).getDay();
      if(notifSettings.morning && hhmm===notifSettings.morningTime && notifSettings.morningDays.includes(todayDow)) {
        const todayTasks = tasks.filter(t=>!t.done&&t.date===todayStr);
        if(todayTasks.length>0) {
          const key=`morning-${todayStr}`;
          if(!notifFired.current.has(key)){
            notifFired.current.add(key);
            sendNotif(`📋 今日のタスク（${todayTasks.length}件）`, todayTasks.map(t=>t.title).join("、").slice(0,80));
          }
        }
      }

      // 予定の事前通知
      if(notifSettings.before && notifSettings.beforeMin>0){
        events.filter(ev=>ev.date===todayStr&&ev.time&&ev.notif?.enabled!==false).forEach(ev=>{
          const [eh,em]=ev.time.split(":").map(Number);
          const evMin=eh*60+em;
          if(evMin-nowMin===notifSettings.beforeMin){
            const key=`ev-before-${ev.id}-${ev.time}`;
            if(!notifFired.current.has(key)){ notifFired.current.add(key); sendNotif(`⏰ ${notifSettings.beforeMin}分後「${ev.title}」`,ev.location||ev.time); }
          }
        });
      }
      tasks.filter(t=>!t.done).forEach(t => {
        // X minutes before task time
        if(notifSettings.before && notifSettings.beforeMin>0 && t.date===todayStr && t.time) {
          const [th,tm]=t.time.split(":").map(Number);
          const taskMin=th*60+tm;
          if(taskMin-nowMin===notifSettings.beforeMin){
            const key=`before-${t.id}-${t.time}`;
            if(!notifFired.current.has(key)){ notifFired.current.add(key); sendNotif(`⏰ ${notifSettings.beforeMin}分後に開始`,t.title); }
          }
        }
        // custom per-task notification time
        const tn = notifSettings.taskNotifs[t.id];
        if(tn?.enabled && tn?.customTime && t.date===todayStr && hhmm===tn.customTime) {
          const key=`custom-${t.id}-${todayStr}`;
          if(!notifFired.current.has(key)){ notifFired.current.add(key); sendNotif(`🔔 カスタム通知`,t.title); }
        }
        // per-task notif field (from TaskModal)
        if(t.notif?.enabled && t.notif?.time && t.date===todayStr && hhmm===t.notif.time) {
          const key=`task-notif-${t.id}-${todayStr}`;
          if(!notifFired.current.has(key)){ notifFired.current.add(key); sendNotif(`🔔 ${t.title}`,t.memo||t.time); }
        }
        // overdue
        if(notifSettings.overdue && t.date<todayStr) {
          const overdueKey = notifSettings.overdueRepeat==="hourly"
            ? `overdue-${t.id}-${hhmm.slice(0,2)}`
            : `overdue-${t.id}-once`;
          if(now.getMinutes()===0 || notifSettings.overdueRepeat==="once") {
            if(!notifFired.current.has(overdueKey)){ notifFired.current.add(overdueKey); sendNotif("⚠️ 期限切れ",`${t.title}（${t.date}）`); }
          }
        }
      });
    }, 60000);
    return ()=>clearInterval(tick);
  }, [tasks, events, notifPerm, notifSettings]);
  const updStatus   = (id,s) => setProjects(ps => ps.map(p => p.id===id ? {...p,status:s} : p));
  const updProgress = (id,v) => setProjects(ps => ps.map(p => p.id===id ? {...p,progress:+v} : p));

  // ── calendar helpers ──
  const prevMonth  = () => setCalDate(d => { const m=d.month-1; return m<0?{year:d.year-1,month:11}:{...d,month:m}; });
  const nextMonth  = () => setCalDate(d => { const m=d.month+1; return m>11?{year:d.year+1,month:0}:{...d,month:m}; });
  const tasksOn    = d => tasks.filter(t=>t.date===d);
  const eventsOn   = d => events.filter(e=>e.date===d);
  const projOf     = id => projects.find(p=>p.id===id);
  const SW         = sideOpen ? 216 : 56;
  const ganttMons  = Array.from({length:12},(_,i)=>({year:todayObj.getFullYear(),month:i}));

  // week start: snap weekStart to correct weekday
  const wso = settings.weekStartsOn; // 0=Sun,1=Mon
  const getWeekStart = (base) => {
    const d = new Date(base);
    const dow = d.getDay();
    const diff = (dow - wso + 7) % 7;
    d.setDate(d.getDate() - diff);
    return d.toISOString().slice(0,10);
  };
  const weekDays = Array.from({length:7},(_,i)=>addD(getWeekStart(weekStart),i));

  // day-of-week label order
  const DOW_LABELS = wso===0 ? ["日","月","火","水","木","金","土"] : ["月","火","水","木","金","土","日"];
  // is weekend given weekStartsOn
  const isSun = (dateStr) => new Date(dateStr).getDay()===0;
  const isSat = (dateStr) => new Date(dateStr).getDay()===6;
  const isWeekend = (dateStr) => isSun(dateStr)||isSat(dateStr);

  // month calendar first-day-offset
  const fdoAdjusted = (y,m) => (fdo(y,m) - wso + 7) % 7;

  // ── データ エクスポート／インポート ──
  const exportData = () => {
    const data = { tasks, events, projects, eventCats, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `sanzan_backup_${TODAY}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const importData = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.tasks)     setTasks(d.tasks);
        if(d.events)    setEvents(d.events);
        if(d.projects)  setProjects(d.projects);
        if(d.eventCats) setEventCats(d.eventCats);
        if(d.settings)  setSettings(d.settings);
        alert("インポート完了しました！");
      } catch(err) {
        alert("ファイルの読み込みに失敗しました。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // タスク状態ヘルパー
  const isOverdue  = t => !t.done && t.date && t.date < TODAY;


  const isHighPrio = t => t.priority === "high";

  const blankTask  = (date,time) => ({ title:"", date:date||"", time:time||"", priority:"medium", project:null });
  const blankEvent = (date,time) => ({ title:"", date:date||TODAY, time:time||"10:00", timeEnd:"", location:"", memo:"", category:null });
  // ── 繰り返し展開 ──
  // 元アイテムから繰り返し分を生成して配列で返す
  const expandRepeat = (item) => {
    const r = item.repeat;
    if (!r || r === "none") return [item];
    const base = new Date(item.date);
    const endDate = item.repeatEnd ? new Date(item.repeatEnd) : new Date(base.getFullYear()+2, base.getMonth(), base.getDate());
    const results = [];
    let cur = new Date(base);
    let idx = 0;
    while (cur <= endDate && idx < 365) {
      const dow = cur.getDay();
      const skip = r === "weekday" && (dow === 0 || dow === 6);
      if (!skip) {
        const dateStr = cur.toISOString().slice(0,10);
        results.push({
          ...item,
          id: idx === 0 ? item.id : (item.id + "_r" + idx),
          date: dateStr,
          _repeatBase: item.id,
          _repeatIdx: idx,
        });
      }
      // advance
      if (r === "daily" || r === "weekday") cur.setDate(cur.getDate()+1);
      else if (r === "weekly")  cur.setDate(cur.getDate()+7);
      else if (r === "monthly") cur.setMonth(cur.getMonth()+1);
      else if (r === "yearly")  cur.setFullYear(cur.getFullYear()+1);
      idx++;
    }
    return results;
  };

  const blankProj  = () => ({ name:"", color:"#2563EB", status:"未着手", owner:"", start:TODAY, end:addD(TODAY,30), progress:0 });

  // ── 認証・ロード状態チェック ──

  if (!authUser) return <AuthScreen />;
  if (!dataLoaded) return (

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gridTemplateRows:"1fr 1fr",gap:12,flex:1,minHeight:0,gridTemplateAreas:"'today-ev today-task' 'tom-ev tom-task'"}}>

                            {ev.memo&&<div style={{fontSize:11,color:"#94A3B8",marginTop:4,lineHeight:1.5,borderLeft:`2px solid ${cat.color}44`,paddingLeft:6}}>{ev.memo}</div>}
                          </div>
                          
                        </div>
                        );
                      })}
                      {eventsOn(selDay).length===0&&(
                        <div style={{color:"#94A3B8",fontSize:13}}>この日の予定はありません</div>

                  </div>
                )}
              </div>

            {/* ══ PROJECTS ══ */}
            {view==="projects" && (
              <div className="fade" style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <h1 style={{fontSize:20,fontWeight:700,letterSpacing:"-.5px"}}>案件管理</h1>
                  <div style={{display:"flex",gap:3,background:"#F1F5F9",borderRadius:8,padding:3,border:"1px solid #E2E8F0"}}>
                    <button className={`subbtn${projView==="kanban"?" act":""}`} onClick={()=>setProjView("kanban")}>かんばん</button>
                    <button className={`subbtn${projView==="gantt"?" act":""}`}  onClick={()=>setProjView("gantt")}>ガント</button>
                    <button className={`subbtn${projView==="schedule"?" act":""}`} onClick={()=>setProjView("schedule")}>スケジュール</button>
                  </div>
                </div>
                {projects.length===0&&(
                  <div className="card" style={{padding:48}}><EmptyState icon="◈" text="案件がまだありません" sub="右上の「＋ 案件」から追加してください"/></div>
                )}

                {projView==="kanban"&&projects.length>0&&(
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
                    {KANBAN_COLS.map(col=>{
                      const colP=projects.filter(p=>p.status===col);
                      const sc=STATUS_CFG[col];
                      return (
                        <div key={col}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                            <div style={{width:7,height:7,borderRadius:"50%",background:sc.color}}/>
                            <span style={{fontSize:12,fontWeight:600,color:sc.color}}>{col}</span>
                            <span style={{fontSize:10,color:"#94A3B8",background:"#F1F5F9",padding:"1px 6px",borderRadius:8}}>{colP.length}</span>
                          </div>
                          {colP.map(p=>{
                            const pT=tasks.filter(t=>t.project===p.id);
                            const done=pT.filter(t=>t.done).length;

                              <div key={p.id} className="kcard" style={{borderTop:`2px solid ${p.color}`}} onClick={()=>setProjMdl(p)}>

                                  <span style={{fontSize:13,fontWeight:600,lineHeight:1.4}}>{p.name}</span>
                                  
                                </div>
                                <div style={{fontSize:11,color:"#64748B",marginBottom:10}}>
                                  <span className="tag" style={{background:sc.bg,color:sc.color,marginRight:8}}>{p.status}</span>
                                  👤 {p.owner||"未設定"} · 〜{p.end}
                                </div>
                                {p.description&&<div style={{fontSize:12,color:"#94A3B8",marginBottom:10,lineHeight:1.6,borderLeft:"2px solid #E2E8F0",paddingLeft:8}}>{p.description}</div>}

                                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94A3B8",marginBottom:4}}>

                                  </div>
                                  <div className="pbar"><div className="pfill" style={{width:`${p.progress}%`,background:p.color}}/></div>
                                </div>
                                {pT.length>0&&<div style={{fontSize:11,color:"#94A3B8"}}>{pT.length}件中 <span style={{color:"#059669",fontWeight:600}}>{done}完了</span></div>}

                  </div>

                {projView==="schedule"&&(
                  <ScheduleView

                    tasks={tasks}
                    onTaskToggle={(t)=>{
                      const newDone = !t.done;
                      setTasks(ts=>ts.map(x=>x.id===t.id?{...x,done:newDone}:x));
                      // チェックシートタスクの場合はcheckDoneも連動
                      if(t._fromChecklist){
                        setEvents(prev=>prev.map(ev=>{
                          const ids=ev.checklistIds||(ev.checklist?[ev.checklist]:[]);
                          for(const clId of ids){
                            const taskMap=ev.checkTaskIds?.[clId];
                            if(!taskMap) continue;
                            const idx=Object.keys(taskMap).find(i=>taskMap[i]===t.id);
                            if(idx!==undefined){
                              return {...ev,checkDone:{...(ev.checkDone||{}),[clId]:{...(ev.checkDone?.[clId]||{}),[idx]:newDone}}};
                            }
                          }
                          return ev;
                        }));
                      }
                    }}
                    onTaskClick={t=>setTaskMdl(t)}
                    onAddTask={(date,projId)=>setTaskMdl({...blankTask(date,""),project:projId||null})}
                  />
                )}

                                {projView==="gantt"&&projects.length>0&&(
                  <div style={{overflowX:"auto",flex:1}}>
                    <div style={{minWidth:700}}>
                      <div style={{display:"grid",gridTemplateColumns:`180px repeat(12,1fr)`,background:"#F8FAFC",borderRadius:"10px 10px 0 0",borderBottom:"1px solid #E2E8F0"}}>
                        <div style={{padding:"8px 12px",fontSize:10,fontWeight:600,color:"#94A3B8",borderRight:"1px solid #E2E8F0",textTransform:"uppercase",letterSpacing:".5px"}}>案件</div>
                        {ganttMons.map(({month})=>(
                          <div key={month} style={{padding:"8px 4px",textAlign:"center",fontSize:10,fontWeight:600,color:"#94A3B8",borderRight:"1px solid #E2E8F0"}}>{MON[month]}</div>
                        ))}
                      </div>
                      {projects.map((p,idx)=>(
                        <div key={p.id} style={{display:"grid",gridTemplateColumns:`180px repeat(12,1fr)`,borderBottom:"1px solid #E2E8F0",background:idx%2===0?"#fff":"#FAFBFC",minHeight:44,alignItems:"center",cursor:"pointer"}}
                          onClick={()=>setProjMdl(p)}>
                          <div style={{padding:"8px 12px",borderRight:"1px solid #E2E8F0",display:"flex",alignItems:"center",gap:7}}>
                            <div style={{width:7,height:7,borderRadius:"50%",background:p.color,flexShrink:0}}/>
                            <span style={{fontSize:12,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                          </div>
                          {ganttMons.map(({year,month})=>{
                            const cs=`${year}-${String(month+1).padStart(2,"0")}-01`;
                            const ce=`${year}-${String(month+1).padStart(2,"0")}-${dim(year,month)}`;
                            const ov=p.start<=ce&&p.end>=cs;
                            const bs=p.start>cs?p.start:cs;
                            const be=p.end<ce?p.end:ce;
                            const cd=dim(year,month);
                            const op=ov?(dBet(cs,bs)/cd)*100:0;
                            const wp=ov?Math.min(100-op,(dBet(bs,be)+1)/cd*100):0;
                            return (
                              <div key={month} style={{position:"relative",height:24,borderRight:"1px solid #E2E8F0",padding:"0 2px"}}>
                                {ov&&<div style={{position:"absolute",top:"50%",transform:"translateY(-50%)",left:`calc(${op}% + 2px)`,width:`calc(${wp}% - 4px)`,height:10,borderRadius:3,background:p.color,opacity:.8,minWidth:3}}/>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ══ TASKS ══ */}

              <div className="fade" style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <h1 style={{fontSize:20,fontWeight:700,letterSpacing:"-.5px"}}>タスク一覧</h1>
                    <span style={{fontSize:12,color:"#94A3B8",fontWeight:500}}>{tasks.length}件</span>
                  </div>
                  {/* 検索バー */}
                  <div style={{position:"relative",marginBottom:8}}>
                    <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#94A3B8",fontSize:14}}>🔍</span>
                    <input
                      value={taskSearch}
                      onChange={e=>setTaskSearch(e.target.value)}
                      placeholder="タスクを検索..."
                      style={{width:"100%",paddingLeft:32,paddingRight:taskSearch?32:12,fontSize:13,borderRadius:8,border:"1px solid #E2E8F0",background:"#F8FAFC",height:36}}
                    />
                    {taskSearch&&(
                      <button onClick={()=>setTaskSearch("")}
                        style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"#94A3B8",fontSize:16,lineHeight:1}}>✕</button>
                    )}
                  </div>
                  {/* フィルターバー */}
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                    {/* 状態フィルター */}
                    {[{v:"all",l:"すべて"},{v:"undone",l:"未完了"},{v:"done",l:"完了済み"},{v:"overdue",l:"⚠ 期限切れ"}].map(opt=>(
                      <button key={opt.v} className="subbtn"
                        style={{background:taskFilter.status===opt.v?A.main:"#F1F5F9",color:taskFilter.status===opt.v?"#fff":"#64748B",
                          border:taskFilter.status===opt.v?`1px solid ${A.main}`:"1px solid #E2E8F0",fontSize:11,padding:"4px 10px"}}
                        onClick={()=>setTaskFilter(f=>({...f,status:opt.v}))}>
                        {opt.l}
                      </button>
                    ))}
                    <div style={{width:1,height:16,background:"#E2E8F0"}}/>
                    {/* 優先度フィルター */}
                    {[{v:"all",l:"全優先度"},{v:"high",l:"高"},{v:"medium",l:"中"},{v:"low",l:"低"}].map(opt=>(
                      <button key={opt.v} className="subbtn"
                        style={{background:taskFilter.priority===opt.v?PRIORITY[opt.v]?.bg??"#F1F5F9":"#F1F5F9",
                          color:taskFilter.priority===opt.v?PRIORITY[opt.v]?.color??"#64748B":"#64748B",
                          border:taskFilter.priority===opt.v?`1px solid ${PRIORITY[opt.v]?.color??"#E2E8F0"}`:"1px solid #E2E8F0",fontSize:11,padding:"4px 10px"}}
                        onClick={()=>setTaskFilter(f=>({...f,priority:opt.v}))}>
                        {opt.l}
                      </button>
                    ))}
                    <div style={{width:1,height:16,background:"#E2E8F0"}}/>
                    {/* 案件フィルター */}
                    <select value={taskFilter.project} onChange={e=>setTaskFilter(f=>({...f,project:e.target.value}))}
                      style={{fontSize:11,padding:"4px 8px",borderRadius:6,border:"1px solid #E2E8F0",color:"#64748B",background:"#F1F5F9"}}>
                      <option value="all">全案件</option>
                      {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      <option value="none">案件なし</option>
                    </select>
                  </div>
                </div>

                {(()=>{
                  // フィルター適用
                  let filtered = [...tasks];
                  if(taskFilter.status==="undone")  filtered=filtered.filter(t=>!t.done);
                  if(taskFilter.status==="done")    filtered=filtered.filter(t=>t.done);
                  if(taskFilter.status==="overdue") filtered=filtered.filter(t=>isOverdue(t));
                  if(taskFilter.priority!=="all")   filtered=filtered.filter(t=>t.priority===taskFilter.priority);
                  if(taskFilter.project==="none")   filtered=filtered.filter(t=>!t.project);
                  else if(taskFilter.project!=="all") filtered=filtered.filter(t=>t.project===taskFilter.project);
                  if(taskSearch.trim()){
                    const q=taskSearch.trim().toLowerCase();
                    filtered=filtered.filter(t=>
                      t.title.toLowerCase().includes(q)||
                      (t.memo||"").toLowerCase().includes(q)||
                      (t._eventTitle||"").toLowerCase().includes(q)||
                      (projOf(t.project)?.name||"").toLowerCase().includes(q)
                    );
                  }
                  filtered.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

                  // 未完了・完了でグループ分け
                  const undone = filtered.filter(t=>!t.done);
                  const done   = filtered.filter(t=>t.done);

                  if(filtered.length===0) return <div className="card" style={{padding:48}}><EmptyState icon="≡" text="タスクがありません" sub="フィルターを変更してみてください"/></div>;

                  const renderRow = t => {
                    const p=projOf(t.project);
                    const od=isOverdue(t); const hi=isHighPrio(t)&&!t.done;
                    return (
                      <tr key={t.id} className="trow" style={{borderBottom:"1px solid #E2E8F0",cursor:"pointer",background:od?"#FFF5F5":hi?"#FFFBEB":"transparent"}}

                        <td style={{padding:"10px 14px",width:36}} onClick={e=>e.stopPropagation()}>
                          <input type="checkbox" checked={t.done} onChange={()=>toggleDone(t.id)} style={{accentColor:A.main,cursor:"pointer"}}/>
                        </td>
                        <td style={{padding:"10px 14px",fontSize:13,fontWeight:hi?700:500,
                          color:t.done?"#CBD5E1":od?"#DC2626":hi?"#DC2626":"#0F1923",
                          textDecoration:t.done?"line-through":"none"}}>
                          {od&&!t.done&&<span style={{marginRight:4}}>⚠</span>}{t.title}{t._eventTitle&&<span style={{fontSize:11,color:"#94A3B8",fontWeight:400}}> （{t._eventTitle}）</span>}

                        <td style={{padding:"10px 14px",fontSize:12,color:od?"#DC2626":"#94A3B8",fontWeight:od?600:400,whiteSpace:"nowrap"}}>{t.date}{t.time?` ${t.time}`:""}{t.timeEnd?`–${t.timeEnd}`:""}</td>
                        <td style={{padding:"10px 14px"}}>{p?<span style={{color:p.color,background:p.color+"14",fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:4}}>{p.name}</span>:<span style={{color:"#E2E8F0",fontSize:11}}>—</span>}</td>
                        <td style={{padding:"10px 14px"}}><span className="tag" style={{background:PRIORITY[t.priority].bg,color:PRIORITY[t.priority].color,fontWeight:hi?700:600}}>{PRIORITY[t.priority].label}</span></td>
                        <td style={{padding:"10px 14px"}}><span className="tag" style={{background:od?"#FEE2E2":t.done?"#F0FDF4":"#F8FAFC",color:od?"#DC2626":t.done?"#059669":"#94A3B8"}}>{od?"期限切れ":t.done?"完了":"未完"}</span></td>
                      </tr>
                    );
                  };

                  return (
                    <div className="card" style={{overflow:"hidden",display:"flex",flexDirection:"column",flex:1,minHeight:0,margin:0}}>
                      <div style={{overflowY:"auto",flex:1}}>
                        <table style={{width:"100%",borderCollapse:"collapse"}}>
                          <thead>
                            <tr style={{background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",position:"sticky",top:0,zIndex:2}}>
                              {["","タスク名","日時","案件","優先度","状態"].map((h,i)=>(
                                <th key={i} style={{padding:"10px 14px",textAlign:"left",fontSize:10,color:"#94A3B8",fontWeight:600,letterSpacing:".8px",textTransform:"uppercase",background:"#F8FAFC"}}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {/* 未完了 */}
                            {undone.map(renderRow)}
                            {/* 完了済み（折りたたみ） */}
                            {done.length>0&&(
                              <>
                                <tr style={{background:"#F8FAFC",cursor:"pointer"}} onClick={()=>setShowDone(v=>!v)}>
                                  <td colSpan={6} style={{padding:"8px 14px",fontSize:11,fontWeight:600,color:"#94A3B8"}}>
                                    {showDone?"▾":"▸"} 完了済み {done.length}件
                                  </td>
                                </tr>
                                {showDone&&done.map(renderRow)}
                              </>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ══ CORRESPONDENCE ══ */}
{/* ══ COMPANIES ══ */}
            {view==="companies"&&(
              <div className="fade" style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
                <CompanyPage
                  companies={companies}
                  setCompanies={setCompanies}
                  projects={projects}
                  reminderDays={settings.reminderDays||3}
                />
              </div>
            )}

            {/* ══ CHECKLISTS ══ */}
            {view==="checklists"&&(
              <ChecklistPage
                checklists={checklists}
                setChecklists={setChecklists}
                events={events}
                setEvents={setEvents}
                tasks={tasks}
                setTasks={setTasks}
                onEventClick={ev=>setEventMdl(ev)}
              />
            )}



          </main>
        </div>
      </div>

      {/* ── MODALS ── */}
      {eventMdl!==null&&(
        <EventModal
          initial={eventMdl}
          onSave={(ev)=>{
            const ids = ev.checklistIds||[];
            // 各チェックシートのタスクを生成（まだ生成されていないものだけ）
            let allNewTasks=[];
            let allTaskIds={...(ev.checkTaskIds||{})};
            ids.forEach(clId=>{
              if(allTaskIds[clId]) return; // 既に生成済み
              const cl=checklists.find(c=>c.id===clId);
              if(!cl) return;
              const clTaskIds={};
              cl.items.forEach((item,i)=>{
                const id="clt"+Date.now()+clId+i;
                clTaskIds[i]=id;
                allNewTasks.push({id,title:item.text,date:applyOffset(ev.date,item.offset),time:"",priority:"medium",
                  project:null,done:false,memo:ev.title+" のチェックシート",_fromChecklist:true,_eventTitle:ev.title});
              });
              allTaskIds[clId]=clTaskIds;
            });
            // 外れたチェックシートのタスクを削除
            Object.keys(allTaskIds).forEach(clId=>{
              if(!ids.includes(clId)){
                const oldIds=Object.values(allTaskIds[clId]||{});
                if(oldIds.length>0) setTasks(prev=>prev.filter(t=>!oldIds.includes(t.id)));
                delete allTaskIds[clId];
              }
            });
            if(allNewTasks.length>0) setTasks(prev=>[...prev,...allNewTasks]);
            // 後方互換: 旧checklist単一フィールドをクリア
            saveEvent({...ev,checklist:null,checklistIds:ids,checkTaskIds:allTaskIds});
          }}
          onDelete={deleteEvent}
          onClose={()=>setEventMdl(null)}
          notifPerm={notifPerm}
          eventCats={eventCats}
          checklists={checklists}
        />
      )}
      {taskMdl!==null&&(
        <TaskModal
          initial={taskMdl}
          projects={projects}
          onSave={saveTask}
          onDelete={deleteTask}
          onClose={()=>setTaskMdl(null)}
          notifPerm={notifPerm}
          onSaveProject={()=>setProjMdl(blankProj())}
        />
      )}
      {projMdl!==null&&(
        <ProjectModal
          initial={projMdl}
          onSave={saveProject}
          onDelete={deleteProject}
          onClose={()=>setProjMdl(null)}
        />
      )}

      {/* SETTINGS MODAL */}
      {showSettings&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setShowSettings(false)}>
          <div style={{background:"#fff",borderRadius:14,padding:28,width:480,maxWidth:"95vw",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 50px rgba(0,0,0,.2)"}} className="fade">
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:20,letterSpacing:"-.3px"}}>⚙ 設定</h2>
            <div style={{display:"flex",flexDirection:"column",gap:18}}>
              {/* Event category management */}
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div className="lbl">予定の分類</div>
                  <button className="btn" onClick={()=>setEventCats(cs=>[...cs,{id:"c"+Date.now(),label:"新しい分類",color:"#6366F1",icon:"📌"}])}
                    style={{background:A.light,color:A.dark,padding:"4px 10px",fontSize:11,border:`1px solid ${A.mid}`}}>＋ 追加</button>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {eventCats.map(cat=>(
                    <div key={cat.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"#F8FAFC",borderRadius:10,border:"1px solid #E2E8F0"}}>
                      {/* icon picker */}
                      <div style={{position:"relative"}}>
                        <div style={{width:32,height:32,borderRadius:8,background:cat.color+"18",border:`1.5px solid ${cat.color}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,cursor:"pointer",flexShrink:0}}
                          onClick={e=>{e.stopPropagation();const el=e.currentTarget.nextSibling;el.style.display=el.style.display==="none"?"flex":"none";}}>
                          {cat.icon}
                        </div>
                        <div style={{display:"none",position:"absolute",top:36,left:0,zIndex:99,background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:8,boxShadow:"0 8px 24px rgba(0,0,0,.12)",flexWrap:"wrap",gap:4,width:180}}>
                          {["🏢","🚪","🛋","🚗","💼","🤝","🏠","🚃","📌","⭐","🔥","📋","🎯","💡","📞","✈️"].map(ic=>(
                            <div key={ic} onClick={e=>{e.stopPropagation();setEventCats(cs=>cs.map(c=>c.id===cat.id?{...c,icon:ic}:c));e.currentTarget.parentNode.style.display="none";}}
                              style={{width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,cursor:"pointer",fontSize:16,background:cat.icon===ic?A.light:"transparent"}}>
                              {ic}
                            </div>
                          ))}
                        </div>
                      </div>
                      {/* label input */}
                      <input value={cat.label} onChange={e=>setEventCats(cs=>cs.map(c=>c.id===cat.id?{...c,label:e.target.value}:c))}
                        style={{flex:1,fontSize:13,fontWeight:500,border:"none",background:"transparent",outline:"none",padding:0}}/>
                      {/* color swatches */}
                      <div style={{display:"flex",gap:3,flexShrink:0}}>
                        {["#6366F1","#0891B2","#059669","#D97706","#DC2626","#7C3AED","#DB2777","#0F172A","#64748B","#EA580C","#1D4ED8","#065F46"].map(col=>(
                          <div key={col} onClick={()=>setEventCats(cs=>cs.map(c=>c.id===cat.id?{...c,color:col}:c))}
                            style={{width:16,height:16,borderRadius:"50%",background:col,cursor:"pointer",
                              border:cat.color===col?"2px solid #1E293B":"2px solid transparent",transition:"all .1s"}}/>
                        ))}
                      </div>
                      {/* delete */}
                      {eventCats.length>1&&(
                        <button className="btn" onClick={()=>setEventCats(cs=>cs.filter(c=>c.id!==cat.id))}
                          style={{padding:"3px 8px",fontSize:11,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",flexShrink:0}}>✕</button>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="lbl" style={{marginBottom:10}}>カレンダーの週始まり</div>
                <div style={{display:"flex",gap:8}}>
                  {[{val:0,label:"日曜始まり",sub:"Sun → Sat"},{val:1,label:"月曜始まり",sub:"Mon → Sun"}].map(opt=>(
                    <div key={opt.val} onClick={()=>setSettings(s=>({...s,weekStartsOn:opt.val}))}
                      style={{flex:1,padding:"12px 14px",borderRadius:10,cursor:"pointer",
                        border:settings.weekStartsOn===opt.val?`2px solid ${A.main}`:"2px solid #E2E8F0",
                        background:settings.weekStartsOn===opt.val?A.light:"#F8FAFC",
                        transition:"all .15s"}}>
                      <div style={{fontSize:13,fontWeight:600,color:settings.weekStartsOn===opt.val?A.dark:"#374151"}}>{opt.label}</div>
                      <div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{opt.sub}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{padding:"12px 14px",background:"#F8FAFC",borderRadius:10,border:"1px solid #E2E8F0"}}>
                <div style={{fontSize:12,color:"#64748B",lineHeight:1.7}}>
                  🇯🇵 祝日は<strong>2025〜2026年</strong>の日本の祝日に対応しています。<br/>
                  カレンダー上で赤くハイライト・祝日名を表示します。
                </div>
              </div>

              {/* Notification settings */}
              <div>
                <div className="lbl" style={{marginBottom:10}}>デスクトップ通知</div>
                {notifPerm!=="granted"?(
                  <div style={{padding:"14px",background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10}}>
                    <div style={{fontSize:12,color:"#92400E",marginBottom:10,lineHeight:1.6}}>通知を有効にするとタスクのリマインダーをデスクトップに表示できます。</div>
                    <button className="btn" onClick={requestNotifPerm} style={{background:"#D97706",color:"#fff",padding:"8px 16px",fontSize:12,width:"100%"}}>
                      {notifPerm==="denied"?"通知が拒否されています（ブラウザ設定から許可してください）":"通知を許可する 🔔"}
                    </button>
                  </div>
                ):(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>

                    {/* 朝まとめ */}
                    <div style={{padding:"12px",background:"#F8FAFC",borderRadius:8,border:"1px solid #E2E8F0"}}>
                      <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginBottom:notifSettings.morning?10:0}}>
                        <input type="checkbox" checked={notifSettings.morning} onChange={e=>setNotifSettings(s=>({...s,morning:e.target.checked}))} style={{accentColor:A.main,width:15,height:15}}/>
                        <div style={{fontSize:13,fontWeight:600}}>📋 今日のタスク通知</div>
                      </label>
                      {notifSettings.morning&&(
                        <div style={{display:"flex",flexDirection:"column",gap:8,paddingLeft:25}}>
                          {/* 時刻 */}
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:12,color:"#64748B",minWidth:36}}>時刻</span>
                            <input type="time" value={notifSettings.morningTime}
                              onChange={e=>setNotifSettings(s=>({...s,morningTime:e.target.value}))}
                              style={{fontSize:12,padding:"4px 8px",borderRadius:6,width:"auto"}}/>
                          </div>
                          {/* 曜日 */}
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{fontSize:12,color:"#64748B",minWidth:36}}>曜日</span>
                            <div style={{display:"flex",gap:4}}>
                              {["日","月","火","水","木","金","土"].map((d,i)=>{
                                const on = notifSettings.morningDays.includes(i);
                                const isSunDay=i===0; const isSatDay=i===6;
                                const activeColor = isSunDay?"#EF4444":isSatDay?A.main:A.main;
                                const activeBg    = isSunDay?"#FEF2F2":isSatDay?A.light:A.light;
                                return (
                                  <div key={i} onClick={()=>setNotifSettings(s=>{
                                    const days = on ? s.morningDays.filter(x=>x!==i) : [...s.morningDays,i].sort();
                                    return {...s, morningDays:days};
                                  })} style={{
                                    width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",
                                    fontSize:11,fontWeight:700,cursor:"pointer",transition:"all .12s",
                                    background:on?activeBg:"#F1F5F9",
                                    color:on?activeColor:"#94A3B8",
                                    border:on?`1.5px solid ${activeColor}33`:"1.5px solid #E2E8F0",
                                  }}>{d}</div>
                                );
                              })}
                            </div>
                          </div>
                          {/* プリセット */}
                          <div style={{display:"flex",gap:6}}>
                            <button className="subbtn" onClick={()=>setNotifSettings(s=>({...s,morningDays:[1,2,3,4,5]}))}
                              style={{fontSize:10,padding:"3px 8px"}}>平日</button>
                            <button className="subbtn" onClick={()=>setNotifSettings(s=>({...s,morningDays:[0,1,2,3,4,5,6]}))}
                              style={{fontSize:10,padding:"3px 8px"}}>毎日</button>
                            <button className="subbtn" onClick={()=>setNotifSettings(s=>({...s,morningDays:[0,6]}))}
                              style={{fontSize:10,padding:"3px 8px"}}>休日</button>
                          </div>
                          <div style={{fontSize:11,color:"#94A3B8"}}>
                            {notifSettings.morningDays.length===0
                              ? "⚠️ 曜日が選択されていません"
                              : `設定中: ${["日","月","火","水","木","金","土"].filter((_,i)=>notifSettings.morningDays.includes(i)).join("・")} ${notifSettings.morningTime}`
                            }
                          </div>
                        </div>
                      )}
                    </div>

                    {/* 開始前 */}
                    <div style={{padding:"12px",background:"#F8FAFC",borderRadius:8,border:"1px solid #E2E8F0"}}>
                      <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginBottom:notifSettings.before?8:0}}>
                        <input type="checkbox" checked={notifSettings.before} onChange={e=>setNotifSettings(s=>({...s,before:e.target.checked}))} style={{accentColor:A.main,width:15,height:15}}/>
                        <div style={{fontSize:13,fontWeight:600}}>⏰ 開始前リマインド</div>
                      </label>
                      {notifSettings.before&&(
                        <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:25}}>
                          <span style={{fontSize:12,color:"#64748B"}}>開始の</span>
                          <select value={notifSettings.beforeMin} onChange={e=>setNotifSettings(s=>({...s,beforeMin:+e.target.value}))}
                            style={{fontSize:12,padding:"4px 8px",borderRadius:6,width:"auto"}}>
                            {[5,10,15,20,30,45,60].map(m=><option key={m} value={m}>{m}分前</option>)}
                          </select>
                          <span style={{fontSize:11,color:"#94A3B8"}}>に通知</span>
                        </div>
                      )}
                    </div>

                    {/* 期限切れ */}
                    <div style={{padding:"12px",background:"#F8FAFC",borderRadius:8,border:"1px solid #E2E8F0"}}>
                      <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginBottom:notifSettings.overdue?8:0}}>
                        <input type="checkbox" checked={notifSettings.overdue} onChange={e=>setNotifSettings(s=>({...s,overdue:e.target.checked}))} style={{accentColor:A.main,width:15,height:15}}/>
                        <div style={{fontSize:13,fontWeight:600}}>⚠️ 期限切れ通知</div>
                      </label>
                      {notifSettings.overdue&&(
                        <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:25}}>
                          <span style={{fontSize:12,color:"#64748B"}}>繰り返し</span>
                          <select value={notifSettings.overdueRepeat} onChange={e=>setNotifSettings(s=>({...s,overdueRepeat:e.target.value}))}
                            style={{fontSize:12,padding:"4px 8px",borderRadius:6,width:"auto"}}>
                            <option value="once">1回だけ</option>
                            <option value="hourly">毎時</option>
                          </select>
                        </div>
                      )}
                    </div>

                    <div style={{padding:"8px 12px",background:"#F0FDF4",borderRadius:8,border:"1px solid #BBF7D0",fontSize:11,color:"#166534"}}>
                      ✓ 通知が許可されています。タスクの編集画面でタスクごとの通知時刻も設定できます。
                    </div>
                  </div>
                )}
              </div>
            </div>
            {/* データ管理 */}
            {/* リマインド日数設定 */}
            <div style={{borderTop:"1px solid #F1F5F9",paddingTop:14,marginTop:4}}>
              <div className="lbl" style={{marginBottom:8}}>🏢 企業別管理 リマインド設定</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:12,color:"#374151"}}>先方ボールにした</span>
                <input type="number" min={1} max={30} value={settings.reminderDays||3}
                  onChange={e=>setSettings(s=>({...s,reminderDays:+e.target.value}))}
                  style={{width:56,fontSize:12,textAlign:"center"}}/>
                <span style={{fontSize:12,color:"#374151"}}>日後にリマインド</span>
              </div>
            </div>

            <div style={{borderTop:"1px solid #F1F5F9",paddingTop:16,marginTop:4}}>
              <div className="lbl" style={{marginBottom:10}}>データ管理</div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn" onClick={exportData}
                  style={{flex:1,padding:"10px",fontSize:12,background:"#F0FDF4",color:"#059669",border:"1px solid #BBF7D0",fontWeight:600}}>
                  ⬇ エクスポート（JSON）
                </button>
                <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"10px",fontSize:12,background:"#FFF7ED",color:"#EA580C",border:"1px solid #FED7AA",borderRadius:8,cursor:"pointer",fontWeight:600,userSelect:"none"}}>
                  ⬆ インポート（JSON）
                  <input type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
                </label>
              </div>
              <div style={{fontSize:10,color:"#94A3B8",marginTop:6,lineHeight:1.6}}>
                エクスポートしたJSONファイルを保存しておけば、<br/>新しいファイルでインポートして引き継げます。
              </div>
            </div>
            <div style={{marginTop:16}}>
              <button className="btn" onClick={()=>setShowSettings(false)} style={{width:"100%",background:A.main,color:"#fff",padding:10,fontSize:13,boxShadow:"0 2px 8px rgba(29,78,216,.25)"}}>閉じる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
