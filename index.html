*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F0F4F8;color:#0F1923;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .2s ease forwards}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.btn{cursor:pointer;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;transition:all .15s;font-weight:600}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.sideitem{display:flex;align-items:center;width:100%;border-radius:8px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:#64748B;background:none;transition:all .15s;white-space:nowrap}
.sideitem:hover:not(.act){background:#F1F5F9;color:#0F1923}
.sideitem.act{background:#EFF6FF;color:#1D4ED8;font-weight:600}
.subbtn{cursor:pointer;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;transition:all .15s}
.subbtn.act{background:#1D4ED8;color:#fff;box-shadow:0 2px 8px rgba(29,78,216,.3)}
.subbtn:not(.act){background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0}
.subbtn:not(.act):hover{background:#E2E8F0;color:#0F1923}
input,select,textarea{background:#F8FAFC;border:1px solid #E2E8F0;color:#0F1923;border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;outline:none;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:#3B82F6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
input::placeholder,textarea::placeholder{color:#94A3B8}
.tag{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.2px}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.calday{transition:background .12s;cursor:pointer;border-radius:8px}
.calday:hover{background:#F1F5F9 !important}
.kcard{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:all .15s;cursor:pointer}
.kcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.pbar{height:4px;border-radius:2px;background:#E2E8F0;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}
.trow:hover td{background:#F8FAFC !important}
.sidebar{transition:width .22s cubic-bezier(.4,0,.2,1)}
.toggle-btn{cursor:pointer;border:1px solid #E2E8F0;border-radius:7px;background:#F8FAFC;color:#64748B;display:flex;align-items:center;justify-content:center;width:26px;height:26px;font-size:11px;flex-shrink:0;transition:all .15s}
.toggle-btn:hover{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.conn-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:20px;transition:all .15s}
.conn-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.week-slot{cursor:pointer;transition:background .1s;min-height:20px}
.week-slot:hover{background:rgba(29,78,216,.04)}
.lbl{font-size:10px;font-weight:600;color:#94A3B8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  /* time inputのホイールスクロール抑制 */
  input[type="time"] { scroll-behavior: none; }

<script>

    if(document.activeElement && document.activeElement.type === "time"){

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const PRIORITY = {
  high  :{ label:"高", color:"#DC2626", bg:"#FEF2F2" },
  medium:{ label:"中", color:"#D97706", bg:"#FFFBEB" },
  low   :{ label:"低", color:"#2563EB", bg:"#EFF6FF" },
};
const STATUS_CFG = {
  "未着手":{ color:"#64748B", bg:"#F1F5F9" },
  "進行中":{ color:"#2563EB", bg:"#EFF6FF" },
  "完了"  :{ color:"#16A34A", bg:"#F0FDF4" },
};
const KANBAN_COLS   = ["未着手","進行中","完了"];
const PROJECT_PALETTE = ["#2563EB","#DC2626","#7C3AED","#D97706","#059669","#DB2777","#0891B2","#EA580C"];
const NAV_ITEMS = [
  { v:"dashboard",    icon:"▦", label:"ダッシュボード" },
  { v:"calendar",     icon:"▣", label:"カレンダー" },
  { v:"projects",     icon:"◈", label:"案件管理"       },
  { v:"companies",     icon:"🏢", label:"企業別管理"     },
  { v:"tasks",        icon:"≡", label:"タスク一覧"     },
  { v:"checklists",   icon:"☑", label:"チェックシート" },
];
const MON   = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const HOURS = Array.from({length:24},(_,i)=>i); // 0-23

const TODAY    = new Date().toISOString().slice(0,10);
const todayObj = new Date(TODAY);
const dim  = (y,m) => new Date(y,m+1,0).getDate();
const fdo  = (y,m) => new Date(y,m,1).getDay();
const ds   = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const addD = (s,n)   => { const d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const applyOffset = (date, offset) => {
  if(offset === "biz-1") return addBusinessDays(date, -1);
  if(offset === "input-day") return TODAY; // 入力当日
  return addD(date, offset||0);
};
const TOMORROW  = addD(TODAY, 1);
const dBet = (a,b)   => Math.round((new Date(b)-new Date(a))/86400000);
const pad  = n => String(n).padStart(2,"0");
const A    = { main:"#1D4ED8", light:"#EFF6FF", mid:"#BFDBFE", dark:"#1E40AF" };

const SLOT_H = 52; // px per 30min slot

/* ── 日本の祝日 (2025-2026) ── */
const JP_HOLIDAYS = {
  "2025-01-01":"元日","2025-01-13":"成人の日","2025-02-11":"建国記念の日",
  "2025-02-23":"天皇誕生日","2025-02-24":"天皇誕生日 振替","2025-03-20":"春分の日",
  "2025-04-29":"昭和の日","2025-05-03":"憲法記念日","2025-05-04":"みどりの日",
  "2025-05-05":"こどもの日","2025-05-06":"こどもの日 振替","2025-07-21":"海の日",
  "2025-08-11":"山の日","2025-09-15":"敬老の日","2025-09-23":"秋分の日",
  "2025-10-13":"スポーツの日","2025-11-03":"文化の日","2025-11-23":"勤労感謝の日",
  "2025-11-24":"勤労感謝の日 振替",
  "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日",
  "2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",
  "2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日",
  "2026-05-06":"みどりの日 振替","2026-07-20":"海の日","2026-08-11":"山の日",
  "2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日",
  "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
};
const isHoliday = d => !!JP_HOLIDAYS[d];
const holidayName = d => JP_HOLIDAYS[d] || "";
// 前営業日: 指定日からn営業日前（負のoffset）または後（正のoffset）を返す
const addBusinessDays = (s, n) => {
  let d = new Date(s);
  const step = n < 0 ? -1 : 1;
  let remaining = Math.abs(n);
  while(remaining > 0) {
    d.setDate(d.getDate() + step);
    const ds = d.toISOString().slice(0,10);
    const dow = d.getDay();
    if(dow !== 0 && dow !== 6 && !JP_HOLIDAYS[ds]) remaining--;
  }
  return d.toISOString().slice(0,10);
};


function EmptyState({icon, text, sub}) {
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"28px 0",gap:8}}>
      <div style={{fontSize:26,opacity:.15}}>{icon}</div>
      <div style={{fontSize:13,fontWeight:600,color:"#94A3B8"}}>{text}</div>
      {sub && <div style={{fontSize:12,color:"#CBD5E1",textAlign:"center",marginTop:2}}>{sub}</div>}
    </div>
  );
}

function FieldRow({label, children}) {
  return (
    <div>
      <div className="lbl">{label}</div>
      {children}
    </div>
  );
}

/* ─── EVENT CHIP (month calendar) ─── */
function EventChip({ item, eventCats, onClick }) {
  const cat = eventCats.find(c=>c.id===item.category) || eventCats[0] || {label:"",color:"#6366F1",icon:"📅"};
  return (
    <div onClick={onClick}
      style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:cat.color+"18",color:cat.color,
        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:2,fontWeight:600,cursor:"pointer"}}>
      {cat.icon} {item.title}
    </div>
  );
}

/* ─── EVENT MODAL (予定) ─── */
function EventModal({ initial, onSave, onDelete, onClose, notifPerm, eventCats, checklists }) {
  const [e, setE] = useState({...initial, checklistIds: initial.checklistIds||(initial.checklist?[initial.checklist]:[])});
  const isEdit = !!initial.id;
  const notifEnabled = e.notif?.enabled ?? false;
  const notifTime    = e.notif?.time ?? e.time ?? "09:00";
  const setNotif = (patch) => setE(v=>({...v, notif:{...(v.notif||{}), ...patch}}));
  return (
    <div className="overlay">
      <div style={{background:"#fff",borderRadius:14,padding:28,width:420,maxWidth:"93vw",
        boxShadow:"0 20px 50px rgba(0,0,0,.2)",maxHeight:"90vh",overflowY:"auto"}} className="fade">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
          <div style={{width:28,height:28,borderRadius:7,background:"#EFF6FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>📅</div>
          <h2 style={{fontSize:16,fontWeight:700,letterSpacing:"-.3px"}}>{isEdit?"予定を編集":"予定を追加"}</h2>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <FieldRow label="タイトル *">
            <input value={e.title} onChange={ev=>setE(v=>({...v,title:ev.target.value}))}
              placeholder="予定のタイトル..." style={{width:"100%"}} autoFocus
              onKeyDown={ev=>ev.key==="Enter"&&e.title.trim()&&onSave(e)}/>
          </FieldRow>

          {/* カテゴリ */}
          <div>
            <div className="lbl" style={{marginBottom:6}}>分類</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {/* 未設定 */}
              <div onClick={()=>setE(v=>({...v,category:null}))}
                style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",borderRadius:20,
                  fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .12s",
                  background:!e.category?"#64748B":"#F1F5F9",
                  color:!e.category?"#fff":"#64748B",
                  border:`1.5px solid ${!e.category?"#64748B":"#E2E8F0"}`}}>
                <span style={{fontSize:13}}>−</span> 未設定
              </div>
              {eventCats.map(cat=>{
                const active=e.category===cat.id;
                return (
                  <div key={cat.id} onClick={()=>setE(v=>({...v,category:cat.id}))}
                    style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",borderRadius:20,
                      fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .12s",
                      background:active?cat.color:cat.color+"18",
                      color:active?"#fff":cat.color,
                      border:`1.5px solid ${active?cat.color:cat.color+"55"}`}}>
                    <span style={{fontSize:13}}>{cat.icon}</span>{cat.label}
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <FieldRow label="日付">
              <input type="date" value={e.date} onChange={ev=>setE(v=>({...v,date:ev.target.value}))} style={{width:"100%"}}/>
            </FieldRow>
            <FieldRow label="開始">
              <TimeInput value={e.time} onChange={s=>{
                if(s&&(!e.timeEnd||e.timeEnd<=s)){
                  const [h,m]=s.split(":").map(Number);
                  setE(v=>({...v,time:s,timeEnd:`${String(Math.min(h+1,23)).padStart(2,"0")}:${String(m).padStart(2,"0")}`}));
                } else setE(v=>({...v,time:s}));
              }} style={{width:"100%"}}/>
            </FieldRow>
            <FieldRow label="終了">
              <TimeInput value={e.timeEnd||""} onChange={v=>setE(x=>({...x,timeEnd:v}))} style={{width:"100%"}}/>
            </FieldRow>
          </div>
          <FieldRow label="場所">
            <input value={e.location||""} onChange={ev=>setE(v=>({...v,location:ev.target.value}))}
              placeholder="場所・URL..." style={{width:"100%"}}/>
          </FieldRow>
          <FieldRow label="メモ">
            <textarea value={e.memo||""} onChange={ev=>setE(v=>({...v,memo:ev.target.value}))}
              placeholder="メモを入力..." rows={2} style={{width:"100%",resize:"vertical",lineHeight:1.6}}/>
          </FieldRow>

          {/* 繰り返し */}
          <div style={{borderTop:"1px solid #F1F5F9",paddingTop:12}}>
            <div className="lbl" style={{marginBottom:8}}>繰り返し</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[
                {val:"none",   label:"なし"},
                {val:"daily",  label:"毎日"},
                {val:"weekday",label:"平日のみ"},
                {val:"weekly", label:"毎週"},
                {val:"monthly",label:"毎月"},
                {val:"yearly", label:"毎年"},
              ].map(opt=>(
                <div key={opt.val} onClick={()=>setE(v=>({...v,repeat:opt.val,repeatEnd:v.repeatEnd||""}))}
                  style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",transition:"all .12s",
                    background:(e.repeat||"none")===opt.val?"#6366F1":"#F1F5F9",
                    color:(e.repeat||"none")===opt.val?"#fff":"#64748B",
                    border:(e.repeat||"none")===opt.val?"1.5px solid #6366F1":"1.5px solid #E2E8F0"}}>
                  {opt.label}
                </div>
              ))}
            </div>
            {(e.repeat&&e.repeat!=="none")&&(
              <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:12,color:"#64748B"}}>終了日</span>
                <input type="date" value={e.repeatEnd||""} onChange={ev=>setE(v=>({...v,repeatEnd:ev.target.value}))}
                  style={{fontSize:12,padding:"4px 8px",borderRadius:6,flex:1}}/>
                <span style={{fontSize:11,color:"#94A3B8"}}>（空欄=無期限）</span>
              </div>
            )}
          </div>

          {/* チェックシート紐づけ（複数対応） */}
          {checklists&&checklists.length>0&&(
            <div style={{borderTop:"1px solid #F1F5F9",paddingTop:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div className="lbl">☑ チェックシート</div>
                <span style={{fontSize:10,color:"#94A3B8"}}>複数選択可</span>
              </div>
              {/* 紐づけ済みタグ一覧 */}
              {(e.checklistIds||[]).length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:8}}>
                  {(e.checklistIds||[]).map(clId=>{
                    const cl=checklists.find(c=>c.id===clId);
                    if(!cl) return null;
                    return (
                      <div key={clId} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 8px",
                        background:"#EEF2FF",borderRadius:6,border:"1px solid #C7D2FE"}}>
                        <span style={{fontSize:12,fontWeight:600,color:"#4338CA"}}>{cl.name}</span>
                        <span style={{fontSize:10,color:"#6366F1"}}>{cl.items.length}項目</span>
                        <button type="button" onClick={()=>setE(v=>({...v,checklistIds:(v.checklistIds||[]).filter(id=>id!==clId)}))}
                          style={{background:"none",border:"none",cursor:"pointer",color:"#DC2626",fontSize:13,padding:0,lineHeight:1}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
              {/* 追加プルダウン */}
              {checklists.filter(cl=>!(e.checklistIds||[]).includes(cl.id)).length>0&&(
                <select value="" onChange={ev=>{
                  const id=ev.target.value;
                  if(id) setE(v=>({...v,checklistIds:[...(v.checklistIds||[]),id]}));
                }} style={{width:"100%",fontSize:12,color:"#64748B"}}>
                  <option value="">＋ チェックシートを追加...</option>
                  {checklists.filter(cl=>!(e.checklistIds||[]).includes(cl.id)).map(cl=>(
                    <option key={cl.id} value={cl.id}>{cl.name}</option>
                  ))}
                </select>
              )}
              {(e.checklistIds||[]).length===0&&(
                <div style={{fontSize:11,color:"#94A3B8"}}>上のプルダウンから追加してください</div>
              )}
            </div>
          )}

          <div style={{borderTop:"1px solid #F1F5F9",paddingTop:12}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:notifEnabled?10:0}}>
              <input type="checkbox" checked={notifEnabled}
                onChange={ev=>setNotif({enabled:ev.target.checked,time:notifTime})}
                style={{accentColor:A.main,width:14,height:14}} disabled={notifPerm!=="granted"}/>
              <span style={{fontSize:13,fontWeight:600,color:notifPerm!=="granted"?"#CBD5E1":"#374151"}}>
                🔔 この予定に通知を設定
              </span>
              {notifPerm!=="granted"&&<span style={{fontSize:10,color:"#94A3B8",marginLeft:4}}>設定から通知を許可してください</span>}
            </label>
            {notifEnabled&&(
              <div style={{display:"flex",gap:8,paddingLeft:22}}>
                <div style={{flex:1}}>
                  <div className="lbl" style={{marginBottom:4}}>通知時刻</div>
                  <input type="time" value={notifTime} onChange={ev=>setNotif({time:ev.target.value})} style={{width:"100%"}}/>
                </div>
                <div style={{flex:1}}>
                  <div className="lbl" style={{marginBottom:4}}>タイミング</div>
                  <select value={e.notif?.repeat||"once"} onChange={ev=>setNotif({repeat:ev.target.value})} style={{width:"100%"}}>
                    <option value="once">当日のみ</option>
                    <option value="daily">毎日</option>
                    <option value="weekly">毎週</option>
                  </select>
                </div>
              </div>
            )}
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:18}}>
          {isEdit&&(e._repeatBase
            ? <div style={{display:"flex",flexDirection:"column",gap:4}}>
                <button className="btn" onClick={()=>onDelete(e.id,false)} style={{padding:"6px 10px",fontSize:11,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",whiteSpace:"nowrap"}}>この1件を削除</button>
                <button className="btn" onClick={()=>onDelete(e.id,true)}  style={{padding:"6px 10px",fontSize:11,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",whiteSpace:"nowrap"}}>すべて削除</button>
              </div>
            : <button className="btn" onClick={()=>onDelete(e.id,false)} style={{padding:"10px 14px",fontSize:12,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA"}}>削除</button>
          )}
          <button className="btn" onClick={onClose}
            style={{flex:1,background:"#F1F5F9",color:"#64748B",padding:10,fontSize:13,border:"1px solid #E2E8F0"}}>キャンセル</button>
          <button className="btn" onClick={()=>e.title.trim()&&onSave(e)}
            style={{flex:1,background:"#6366F1",color:"#fff",padding:10,fontSize:13,boxShadow:"0 2px 8px rgba(99,102,241,.25)"}}>

/* ─── SCHEDULE VIEW（スプレッドシート形式）─── */
function ScheduleView({ projects, tasks, onTaskToggle, onTaskClick, onAddTask }) {
  const isOverdue  = t => !t.done && t.date && t.date < TODAY;


  const isHighPrio = t => t.priority === "high";
  const todayObj = new Date();
  const [dispYear,  setDispYear]  = React.useState(todayObj.getFullYear());
  const [dispMonth, setDispMonth] = React.useState(todayObj.getMonth());
  const scrollRef = React.useRef(null);
  const dragCol = React.useRef(null);
  const [colOrder, setColOrder] = React.useState(()=>{
    try { const v=localStorage.getItem("sz_colOrder"); return v?JSON.parse(v):null; } catch(e){ return null; }
  });

  // colOrderをlocalStorageに保存
  React.useEffect(()=>{
    try { localStorage.setItem("sz_colOrder", JSON.stringify(colOrder)); } catch(e){}
  }, [colOrder]);

  const dim = (y,m) => new Date(y,m+1,0).getDate();
  const days = Array.from({length: dim(dispYear,dispMonth)}, (_,i) => {
    const d = `${dispYear}-${String(dispMonth+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`;
    const dow = new Date(d).getDay();
    return { d, dow, day: i+1 };
  });
  const DOW = ["日","月","火","水","木","金","土"];
  const MON_JP = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  // 列: 案件（+ 案件なしの「その他」列）
  const baseCols = [...projects.filter(p=>p.status!=="完了"), { id:"__checklist__", name:"チェックシート", color:"#6366F1" }, { id: null, name:"その他", color:"#94A3B8" }];
  // colOrderはidの配列。新しい案件が追加されたら末尾に追加
  const cols = (() => {
    if(!colOrder) return baseCols;
    // colOrderにある順 + colOrderにない新規案件を末尾に追加
    const ordered = colOrder.map(id => baseCols.find(c=>(c.id||"__other__")===(id||"__other__"))).filter(Boolean);
    const missing = baseCols.filter(c => !colOrder.includes(c.id||"__other__"));
    return [...ordered, ...missing];
  })();

  // ドラッグ操作
  const onDragStart = (idx) => { dragCol.current = idx; };
  const onDragOver  = (e, idx) => {
    e.preventDefault();
    if(dragCol.current===null || dragCol.current===idx) return;
    const newCols = [...cols];
    const [removed] = newCols.splice(dragCol.current, 1);
    newCols.splice(idx, 0, removed);
    dragCol.current = idx;
    setColOrder(newCols.map(c=>c.id||"__other__"));
  };
  const onDragEnd = () => { dragCol.current = null; };

  // その日・その案件のタスク取得
  const cellTasks = (date, projId) => {
    if(projId === "__checklist__") return tasks.filter(t => t.date === date && t._fromChecklist);
    if(projId === null) return tasks.filter(t => t.date === date && !t._fromChecklist && (!t.project || !projects.find(p=>p.id===t.project)));
    return tasks.filter(t => t.date === date && t.project === projId && !t._fromChecklist);
  };

  const prevMonth = () => {
    if(dispMonth === 0){ setDispYear(y=>y-1); setDispMonth(11); }
    else setDispMonth(m=>m-1);
  };
  const nextMonth = () => {
    if(dispMonth === 11){ setDispYear(y=>y+1); setDispMonth(0); }
    else setDispMonth(m=>m+1);
  };

  // 月が変わったら今日 or 1日目にスクロール
  React.useEffect(() => {
    if(!scrollRef.current) return;
    const isCurrentMonth = dispYear===todayObj.getFullYear() && dispMonth===todayObj.getMonth();
    const targetId = isCurrentMonth ? `srow-${TODAY}` : `srow-${dispYear}-${String(dispMonth+1).padStart(2,"0")}-01`;
    const el = document.getElementById(targetId);
    if(el) el.scrollIntoView({ block:"start" });
  }, [dispYear, dispMonth]);

  const COL_W = 160;
  const DATE_W = 90;
  const ROW_H = 36;

  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0,overflow:"hidden"}}>
      {/* 月ナビ: 固定 */}
      <div style={{flexShrink:0,background:"#fff",padding:"8px 12px",borderBottom:"1px solid #E2E8F0",borderRadius:"10px 10px 0 0",border:"1px solid #E2E8F0",borderBottomWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button className="btn" onClick={prevMonth} style={{background:"#F1F5F9",color:"#475569",padding:"4px 12px",fontSize:12}}>←</button>
          <span style={{fontWeight:700,fontSize:15,minWidth:80,textAlign:"center"}}>{dispYear}年 {MON_JP[dispMonth]}</span>
          <button className="btn" onClick={nextMonth} style={{background:"#F1F5F9",color:"#475569",padding:"4px 12px",fontSize:12}}>→</button>
          <button className="btn" onClick={()=>{setDispYear(todayObj.getFullYear());setDispMonth(todayObj.getMonth());}}
            style={{background:"#F0FDF4",color:"#059669",padding:"4px 12px",fontSize:11,border:"1px solid #BBF7D0"}}>今月</button>
        </div>
      </div>

      {/* テーブル全体を1つに統合 - theadをstickyに */}
      <div ref={scrollRef} style={{flex:1,overflow:"auto",border:"1px solid #E2E8F0",borderTop:"none",borderRadius:"0 0 10px 10px"}}>
        <table style={{borderCollapse:"collapse",minWidth: DATE_W + COL_W * cols.length,tableLayout:"fixed"}}>
          <thead style={{position:"sticky",top:0,zIndex:3}}>
            <tr style={{background:"#F8FAFC"}}>
              <th style={{width:DATE_W,minWidth:DATE_W,padding:"8px 10px",fontSize:10,fontWeight:600,color:"#94A3B8",
                borderRight:"2px solid #E2E8F0",borderBottom:"2px solid #E2E8F0",textAlign:"left",letterSpacing:".5px",
                position:"sticky",left:0,background:"#F8FAFC",zIndex:4}}>
                日付
              </th>
              {cols.map((p,ci)=>(
                <th key={p.id||"other"}
                  draggable
                  onDragStart={()=>onDragStart(ci)}
                  onDragOver={e=>onDragOver(e,ci)}
                  onDragEnd={onDragEnd}
                  style={{width:COL_W,minWidth:COL_W,padding:"8px 12px",fontSize:11,fontWeight:600,
                    borderRight:"1.5px solid #CBD5E1",borderBottom:"2px solid #E2E8F0",
                    textAlign:"left",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",
                    cursor:"grab",userSelect:"none",background:"#F8FAFC"}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:10,color:"#CBD5E1",letterSpacing:"-1px"}}>⠿</span>
                    <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:p.color}}/>
                    {p.name}
                  </span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {days.map(({d, dow, day})=>{
              const isToday = d === TODAY;
              const isSun = dow===0; const isSat = dow===6;
              // 今日=薄緑、土=やや濃い青、日=やや濃い赤
              const isHol = isHoliday(d);
              const rowBg = isToday?"#F0FDF4": (isSun||isHol)?"#FEE2E2": isSat?"#DBEAFE":"#fff";
              const dowColor = (isSun||isHol)?"#DC2626": isSat?"#1D4ED8":"#94A3B8";
              const dateColor = isToday?"#059669": (isSun||isHol)?"#DC2626": isSat?"#1D4ED8":"#374151";
              return (
                <tr key={d} id={`srow-${d}`} style={{background:rowBg,borderBottom:"1px solid #E2E8F0"}}>
                  {/* 日付セル */}
                  <td style={{width:DATE_W,minWidth:DATE_W,padding:"4px 10px",borderRight:"2px solid #E2E8F0",
                    verticalAlign:"middle",minHeight:ROW_H}}>
                    <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                      <span style={{fontSize:12,fontWeight:isToday?700:500,color:dateColor,
                        background:isToday?"#DCFCE7":"transparent",
                        borderRadius:isToday?4:0,padding:isToday?"1px 5px":0}}>
                        {String(dispMonth+1).padStart(2,"0")}/{String(day).padStart(2,"0")}
                      </span>
                      <span style={{fontSize:10,color:dowColor,fontWeight:600}}>{DOW[dow]}</span>
                      {isHol&&<span style={{fontSize:9,color:"#EF4444",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:60}}>{holidayName(d)}</span>}
                    </div>
                  </td>
                  {/* 案件ごとのセル */}
                  {cols.map(p=>{
                    const ct = cellTasks(d, p.id);
                    return (
                      <td key={p.id||"other"} style={{width:COL_W,minWidth:COL_W,padding:"3px 6px 4px",borderRight:"1.5px solid #CBD5E1",verticalAlign:"top",minHeight:ROW_H}}>
                        {ct.map(t=>(
                          <div key={t.id} style={{display:"flex",alignItems:"center",gap:5,padding:"2px 0",cursor:"pointer"}}
                            onClick={()=>onTaskClick(t)}>
                            <input type="checkbox" checked={!!t.done}
                              onClick={e=>e.stopPropagation()}
                              onChange={()=>onTaskToggle(t)}
                              style={{accentColor:p.color,width:13,height:13,flexShrink:0,cursor:"pointer"}}/>
                            <span style={{fontSize:11,lineHeight:1.4,
                              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:COL_W-36,
                              textDecoration:t.done?"line-through":"none",
                              fontWeight:isHighPrio(t)&&!t.done?700:400,
                              color:t.done?"#94A3B8":isOverdue(t)?"#DC2626":isHighPrio(t)?"#DC2626":"#1E293B"}}>
                              {isOverdue(t)&&<span style={{marginRight:2}}>⚠</span>}{t.title}{t._eventTitle&&<span style={{color:"#94A3B8",fontWeight:400}}> （{t._eventTitle}）</span>}
                            </span>
                          </div>
                        ))}
                        {/* 追加ボタン（常に表示） */}
                        <div onClick={()=>onAddTask&&onAddTask(d,p.id)}
                          style={{marginTop:3,padding:"2px 4px",borderRadius:4,fontSize:11,color:"#CBD5E1",
                            cursor:"pointer",display:"inline-flex",alignItems:"center",gap:2,
                            border:"1px dashed #E2E8F0",transition:"all .1s"}}
                          onMouseEnter={e=>{e.currentTarget.style.color=p.color;e.currentTarget.style.borderColor=p.color;}}
                          onMouseLeave={e=>{e.currentTarget.style.color="#CBD5E1";e.currentTarget.style.borderColor="#E2E8F0";}}>
                          ＋
                        </div>
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

/* ─── TIME INPUT COMPONENT ─── */
function TimeInput({ value, onChange, style }) {
  const hours   = Array.from({length:24},(_,i)=>String(i).padStart(2,"0"));
  const minutes = ["00","10","20","30","40","50"];

  const [h, m] = value && value.includes(":") ? value.split(":") : ["",""];

  const update = (newH, newM) => {
    if(!newH && !newM) { onChange(""); return; }
    onChange(`${newH||"00"}:${newM||"00"}`);
  };

  return (
    <div style={{display:"flex",alignItems:"center",gap:3,...(style||{})}}>
      <select value={h||""} onChange={e=>update(e.target.value,m)}
        style={{flex:1,fontSize:13,padding:"5px 4px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",textAlign:"center"}}>
        <option value="">--</option>
        {hours.map(hh=><option key={hh} value={hh}>{hh}</option>)}
      </select>
      <span style={{color:"#94A3B8",fontWeight:700,fontSize:13}}>:</span>
      <select value={m||""} onChange={e=>update(h,e.target.value)}
        style={{flex:1,fontSize:13,padding:"5px 4px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",textAlign:"center"}}>
        <option value="">--</option>
        {minutes.map(mm=><option key={mm} value={mm}>{mm}</option>)}
      </select>
    </div>
  );
}

const OFFSET_OPTS = [
  {v:"input-day", l:"入力当日"},
  {v:-1,  l:"前日"},
  {v:"biz-1", l:"前営業日"},
  {v:0,   l:"当日中"},
  {v:1,   l:"翌日"},
  {v:2,   l:"2日以内"},
  {v:3,   l:"3日以内"},
  {v:5,   l:"5日以内"},
  {v:7,   l:"1週間以内"},
  {v:14,  l:"2週間以内"},
  {v:30,  l:"1ヶ月以内"},
];

function ChecklistPage({ checklists, setChecklists, events, setEvents, tasks, setTasks, onEventClick }) {
  const [editCl, setEditCl] = React.useState(null);
  const [newItemText, setNewItemText] = React.useState("");
  const [newItemOffset, setNewItemOffset] = React.useState(0);
  const [editEvCl, setEditEvCl] = React.useState(null); // {ev, mode:"change"|"additem"}
  const [addItemText, setAddItemText] = React.useState("");
  const [addItemOffset, setAddItemOffset] = React.useState(0);

  const blankCl = () => ({ id:"cl"+Date.now(), name:"", items:[] });
  // item: { text, offset }

  const saveCl = (cl) => {
    if(!cl.name.trim()) return;
    setChecklists(prev => prev.find(c=>c.id===cl.id) ? prev.map(c=>c.id===cl.id?cl:c) : [...prev, cl]);
    setEditCl(null);
  };
  const deleteCl = (id) => {
    setChecklists(prev=>prev.filter(c=>c.id!==id));
    setEvents(prev=>prev.map(ev=>{const ids=(ev.checklistIds||[]).filter(i=>i!==id);const td={...ev.checkTaskIds||{}};if(td[id]){const old=Object.values(td[id]);setTasks(p=>p.filter(t=>!old.includes(t.id)));delete td[id];}return{...ev,checklistIds:ids,checklist:null,checkDone:{...ev.checkDone||{}},[id]:undefined,checkTaskIds:td};}));
    setEditCl(null);
  };

  // 予定にチェックシートを紐づけたときタスク自動生成
  const applyChecklist = (ev, clId) => {
    const cl = checklists.find(c=>c.id===clId);
    if(!cl) return;
    // 既存の紐づけタスクを削除
    const oldIds = Object.values(ev.checkTaskIds||{});
    if(oldIds.length>0) setTasks(prev=>prev.filter(t=>!oldIds.includes(t.id)));
    // 新しいタスクを生成
    const newTaskIds = {};
    const newTasks = cl.items.map((item,i)=>{
      const id = "clt"+Date.now()+i;
      newTaskIds[i] = id;
      const dueDate = applyOffset(ev.date, item.offset);
      return { id, title:item.text, date:dueDate, time:"", priority:"medium", project:null,
               done:false, memo:`${ev.title} のチェックシート`, _fromChecklist:true, _eventTitle:ev.title };
    });
    setTasks(prev=>[...prev, ...newTasks]);
    setEvents(prev=>prev.map(e=>e.id===ev.id?{...e,checklist:clId,checkDone:{},checkTaskIds:newTaskIds}:e));
  };

  // 進捗
  const getProgress = (ev) => {
    // 複数チェックシート対応
    const ids = ev.checklistIds||(ev.checklist?[ev.checklist]:[]);
    if(ids.length===0) return null;
    const cls = ids.map(id=>checklists.find(c=>c.id===id)).filter(Boolean);
    if(cls.length===0) return null;
    // 全項目数・完了数を集計
    let total=0, done=0;
    cls.forEach(cl=>{
      const taskMap = typeof ev.checkTaskIds?.[cl.id]==="object" ? ev.checkTaskIds[cl.id] : {};
      cl.items.forEach((_,i)=>{
        total++;
        if(ev.checkDone?.[cl.id]?.[i]) done++;
      });
    });
    return { done, total, cls, ids };
  };
  const toggleCheck = (ev, clId, idx) => {
    const newDone = {
      ...(ev.checkDone||{}),
      [clId]:{...(ev.checkDone?.[clId]||{}), [idx]:!ev.checkDone?.[clId]?.[idx]}
    };
    setEvents(prev=>prev.map(e=>e.id===ev.id?{...e,checkDone:newDone}:e));
    const taskId = ev.checkTaskIds?.[clId]?.[idx];
    if(taskId) setTasks(prev=>prev.map(t=>t.id===taskId?{...t,done:!ev.checkDone?.[clId]?.[idx]}:t));
  };

  const eventsWithCl = events.filter(ev=>(ev.checklistIds&&ev.checklistIds.length>0)||ev.checklist)
    .sort((a,b)=>a.date.localeCompare(b.date));

  return (
    <div className="fade" style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexShrink:0}}>
        <h1 style={{fontSize:20,fontWeight:700,letterSpacing:"-.5px"}}>チェックシート</h1>
        <button className="btn" onClick={()=>setEditCl(blankCl())}
          style={{background:A.main,color:"#fff",padding:"7px 16px",fontSize:12,boxShadow:"0 2px 8px rgba(29,78,216,.25)"}}>
          ＋ テンプレート追加
        </button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,flex:1,minHeight:0,overflowY:"auto"}}>
        {/* 左: テンプレート一覧 */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:"#94A3B8",letterSpacing:".5px",marginBottom:10,textTransform:"uppercase"}}>テンプレート</div>
          {checklists.length===0
            ? <div className="card" style={{padding:32,textAlign:"center",color:"#94A3B8",fontSize:13}}>テンプレートがありません<br/><span style={{fontSize:11}}>右上の「＋ テンプレート追加」から作成</span></div>
            : checklists.map(cl=>(
                <div key={cl.id} className="card" style={{padding:16,marginBottom:10,cursor:"pointer"}} onClick={()=>setEditCl({...cl,items:cl.items.map(i=>({...i}))} )}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontSize:14,fontWeight:600}}>{cl.name}</span>
                    <span style={{fontSize:11,color:"#94A3B8",background:"#F1F5F9",padding:"2px 8px",borderRadius:8}}>{cl.items.length}項目</span>
                  </div>
                  {cl.items.slice(0,4).map((item,i)=>(
                    <div key={i} style={{fontSize:12,color:"#64748B",padding:"3px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <span><span style={{color:"#CBD5E1",marginRight:5}}>☐</span>{item.text}</span>
                      <span style={{fontSize:10,color:"#94A3B8",background:"#F8FAFC",padding:"1px 6px",borderRadius:4}}>{OFFSET_OPTS.find(o=>o.v===item.offset)?.l||"当日中"}</span>
                    </div>
                  ))}
                  {cl.items.length>4&&<div style={{fontSize:11,color:"#94A3B8",marginTop:4}}>+{cl.items.length-4}項目</div>}
                </div>
              ))
          }
        </div>

        {/* 右: 予定ごとの進捗 */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:"#94A3B8",letterSpacing:".5px",marginBottom:10,textTransform:"uppercase"}}>予定ごとの進捗</div>

                  <option key={ev.id} value={ev.id}>{ev.date} {ev.title}</option>
                ))}
              </select>
              <select id="cl-cl-sel" style={{flex:2,minWidth:120,fontSize:12,padding:"5px 8px",borderRadius:6,border:"1px solid #E2E8F0"}}
                defaultValue="">
                <option value="">テンプレートを選択...</option>
                {checklists.map(cl=><option key={cl.id} value={cl.id}>{cl.name}</option>)}
              </select>
              <button className="btn" style={{background:A.main,color:"#fff",padding:"5px 14px",fontSize:12}}
                onClick={()=>{
                  const evId=document.getElementById("cl-ev-sel").value;
                  const clId=document.getElementById("cl-cl-sel").value;
                  if(!evId||!clId) return;
                  const ev=events.find(e=>e.id===evId);
                  if(ev) applyChecklist(ev,clId);
                  document.getElementById("cl-ev-sel").value="";
                  document.getElementById("cl-cl-sel").value="";
                }}>紐づける</button>
            </div>
          )}
          {eventsWithCl.length===0
            ? <div className="card" style={{padding:24,textAlign:"center",color:"#94A3B8",fontSize:13}}>紐づけた予定がここに表示されます</div>
            : eventsWithCl.map(ev=>{
                const prog = getProgress(ev);
                if(!prog) return null;
                const pct = prog.total>0 ? Math.round(prog.done/prog.total*100) : 0;
                return (
                  <div key={ev.id} className="card" style={{padding:16,marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.title}</div>
                        <div style={{fontSize:11,color:"#94A3B8"}}>{ev.date} {ev.time||""} · {prog.cls.map(c=>c.name).join("・")}</div>
                      </div>
                      <span style={{fontSize:13,fontWeight:700,color:pct===100?"#059669":A.main,marginLeft:8}}>{pct}%</span>
                    </div>
                    <div className="pbar" style={{marginBottom:10}}>
                      <div className="pfill" style={{width:`${pct}%`,background:pct===100?"#059669":A.main}}/>
                    </div>
                    {/* 各チェックシートの項目 */}
                    {prog.cls.map(cl=>(
                      <div key={cl.id} style={{marginBottom:8}}>
                        <div style={{fontSize:10,fontWeight:600,color:"#6366F1",marginBottom:4,padding:"2px 0",borderBottom:"1px solid #EEF2FF"}}>{cl.name}</div>
                        {cl.items.map((item,i)=>{
                          const taskId = ev.checkTaskIds?.[cl.id]?.[i];
                          const t = tasks.find(t=>t.id===taskId);
                          const due = t?.date;
                          const od = due && due < TODAY && !ev.checkDone?.[cl.id]?.[i];
                          return (
                            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #F8FAFC",cursor:"pointer"}}
                              onClick={()=>toggleCheck(ev,cl.id,i)}>
                              <input type="checkbox" checked={!!ev.checkDone?.[cl.id]?.[i]} onChange={()=>toggleCheck(ev,cl.id,i)}
                                style={{accentColor:A.main,width:14,height:14,cursor:"pointer",flexShrink:0}}/>
                              <div style={{flex:1,minWidth:0}}>
                                <span style={{fontSize:12,color:ev.checkDone?.[cl.id]?.[i]?"#94A3B8":od?"#DC2626":"#1E293B",
                                  textDecoration:ev.checkDone?.[cl.id]?.[i]?"line-through":"none",fontWeight:od?600:400}}>
                                  {od&&<span style={{marginRight:3}}>⚠</span>}{item.text}
                                </span>
                              </div>
                              {due&&<span style={{fontSize:10,color:od?"#DC2626":"#94A3B8",whiteSpace:"nowrap",background:od?"#FEF2F2":"#F8FAFC",padding:"1px 6px",borderRadius:4}}>{due.slice(5).replace("-","/")}</span>}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                );
              })
          }
        </div>
      </div>

      {/* 予定のチェックシート操作モーダル */}
      {editEvCl&&(
        <div className="overlay">
          <div style={{background:"#fff",borderRadius:14,padding:28,width:440,maxWidth:"93vw",boxShadow:"0 20px 50px rgba(0,0,0,.2)",maxHeight:"90vh",overflowY:"auto"}} className="fade">
            {editEvCl.mode==="change"?(
              <>
                <h2 style={{fontSize:16,fontWeight:700,marginBottom:6}}>テンプレートを変更</h2>
                <div style={{fontSize:12,color:"#94A3B8",marginBottom:16}}>{editEvCl.ev.title}</div>
                <div className="lbl" style={{marginBottom:6}}>新しいテンプレートを選択</div>
                <select defaultValue={editEvCl.ev.checklist||""}
                  id="evclchange-sel"
                  style={{width:"100%",fontSize:12,marginBottom:16}}>
                  <option value="">紐づけなし</option>
                  {checklists.map(cl=><option key={cl.id} value={cl.id}>{cl.name}</option>)}
                </select>
                <div style={{display:"flex",gap:8}}>
                  <button className="btn" onClick={()=>setEditEvCl(null)} style={{flex:1,background:"#F1F5F9",color:"#64748B",padding:10,fontSize:13,border:"1px solid #E2E8F0"}}>キャンセル</button>
                  <button className="btn" style={{flex:1,background:A.main,color:"#fff",padding:10,fontSize:13}}
                    onClick={()=>{
                      const newClId=document.getElementById("evclchange-sel").value||null;
                      if(newClId){
                        applyChecklist(editEvCl.ev, newClId);
                      } else {
                        const oldIds=Object.values(editEvCl.ev.checkTaskIds||{});
                        if(oldIds.length>0) setTasks(prev=>prev.filter(t=>!oldIds.includes(t.id)));
                        setEvents(prev=>prev.map(e=>e.id===editEvCl.ev.id?{...e,checklist:null,checkDone:{},checkTaskIds:{}}:e));
                      }
                      setEditEvCl(null);
                    }}>変更する</button>
                </div>
              </>
            ):(
              <>
                <h2 style={{fontSize:16,fontWeight:700,marginBottom:6}}>項目を追加</h2>
                <div style={{fontSize:12,color:"#94A3B8",marginBottom:16}}>{editEvCl.ev.title}</div>
                <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
                  <input value={addItemText} onChange={e=>setAddItemText(e.target.value)}
                    placeholder="追加する項目名..." style={{flex:1,fontSize:12}} autoFocus
                    onKeyDown={e=>e.key==="Enter"&&addItemText.trim()&&(()=>{
                      const newId="clt"+Date.now();
                      const due=applyOffset(editEvCl.ev.date, addItemOffset);
                      const newTask={id:newId,title:addItemText.trim(),date:due,time:"",priority:"medium",project:null,done:false,
                        memo:editEvCl.ev.title+" のチェックシート",_fromChecklist:true,_eventTitle:editEvCl.ev.title};
                      setTasks(prev=>[...prev,newTask]);
                      const newIdx=Object.keys(editEvCl.ev.checkTaskIds||{}).length;
                      setEvents(prev=>prev.map(e=>e.id===editEvCl.ev.id
                        ?{...e,checkTaskIds:{...(e.checkTaskIds||{}),[newIdx]:newId}}:e));
                      // テンプレート側にも追加
                      if(editEvCl.ev.checklist){
                        setChecklists(prev=>prev.map(cl=>cl.id===editEvCl.ev.checklist
                          ?{...cl,items:[...cl.items,{text:addItemText.trim(),offset:addItemOffset}]}:cl));
                      }
                      setAddItemText("");
                    })()}/>
                  <select value={addItemOffset} onChange={e=>setAddItemOffset(isNaN(+e.target.value)?e.target.value:+e.target.value)}
                    style={{fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",minWidth:90}}>
                    {OFFSET_OPTS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
                  </select>
                </div>
                <div style={{fontSize:11,color:"#94A3B8",marginBottom:16}}>Enterで追加、テンプレートにも反映されます</div>
                <div style={{display:"flex",gap:8}}>
                  <button className="btn" onClick={()=>{setEditEvCl(null);setAddItemText("");}} style={{flex:1,background:"#F1F5F9",color:"#64748B",padding:10,fontSize:13,border:"1px solid #E2E8F0"}}>閉じる</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* テンプレート編集モーダル */}
      {editCl&&(
        <div className="overlay">
          <div style={{background:"#fff",borderRadius:14,padding:28,width:480,maxWidth:"93vw",boxShadow:"0 20px 50px rgba(0,0,0,.2)",maxHeight:"90vh",overflowY:"auto"}} className="fade">
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:18}}>{checklists.find(c=>c.id===editCl.id)?"テンプレートを編集":"新しいテンプレート"}</h2>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <div className="lbl" style={{marginBottom:4}}>テンプレート名 *</div>
                <input value={editCl.name} onChange={e=>setEditCl(v=>({...v,name:e.target.value}))}
                  placeholder="例: アポ後フォロー、初回打合せ後..." style={{width:"100%"}} autoFocus/>
              </div>
              <div>
                <div className="lbl" style={{marginBottom:6}}>チェック項目</div>
                {editCl.items.map((item,i)=>(
                  <div key={i} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                    <input value={item.text} onChange={e=>setEditCl(v=>({...v,items:v.items.map((x,j)=>j===i?{...x,text:e.target.value}:x)}))}
                      style={{flex:1,fontSize:12}} placeholder={`項目 ${i+1}`}/>
                    <select value={item.offset||0} onChange={e=>setEditCl(v=>({...v,items:v.items.map((x,j)=>j===i?{...x,offset:isNaN(+e.target.value)?e.target.value:+e.target.value}:x)}))}
                      style={{fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",minWidth:90}}>
                      {OFFSET_OPTS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
                    </select>
                    <button className="btn" onClick={()=>setEditCl(v=>({...v,items:v.items.filter((_,j)=>j!==i)}))}
                      style={{padding:"4px 8px",background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",fontSize:12}}>✕</button>
                  </div>
                ))}
                <div style={{display:"flex",gap:6,marginTop:6,alignItems:"center"}}>
                  <input value={newItemText} onChange={e=>setNewItemText(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter"&&newItemText.trim()){setEditCl(v=>({...v,items:[...v.items,{text:newItemText.trim(),offset:newItemOffset}]}));setNewItemText("");}}}
                    placeholder="項目を追加してEnter..." style={{flex:1,fontSize:12}}/>
                  <select value={newItemOffset} onChange={e=>setNewItemOffset(isNaN(+e.target.value)?e.target.value:+e.target.value)}
                    style={{fontSize:11,padding:"4px 6px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",minWidth:90}}>
                    {OFFSET_OPTS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
                  </select>
                  <button className="btn" onClick={()=>{if(newItemText.trim()){setEditCl(v=>({...v,items:[...v.items,{text:newItemText.trim(),offset:newItemOffset}]}));setNewItemText("");}}}
                    style={{padding:"4px 12px",background:A.light,color:A.dark,border:`1px solid ${A.mid}`,fontSize:12}}>追加</button>
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:20}}>
              {checklists.find(c=>c.id===editCl.id)&&(
                <button className="btn" onClick={()=>deleteCl(editCl.id)}
                  style={{padding:"10px 14px",fontSize:12,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA"}}>削除</button>
              )}
              <button className="btn" onClick={()=>setEditCl(null)} style={{flex:1,background:"#F1F5F9",color:"#64748B",padding:10,fontSize:13,border:"1px solid #E2E8F0"}}>キャンセル</button>
              <button className="btn" onClick={()=>saveCl(editCl)} style={{flex:1,background:A.main,color:"#fff",padding:10,fontSize:13}}>保存する</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── WEEK CARD VIEW（週: 7列×カード上詰め）─── */
function WeekCardView({ weekDays, eventsOn, onDayClick, onEventClick, isHolidayFn, holidayNameFn, eventCats }) {
  const DOW_ALL = ["日","月","火","水","木","金","土"];
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden",background:"#fff",borderRadius:12,border:"1px solid #E2E8F0"}}>
      {/* 曜日ヘッダー行 - 固定 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"2px solid #E2E8F0",background:"#F8FAFC",flexShrink:0}}>
        {weekDays.map(d=>{
          const dow = new Date(d).getDay();
          const isT = d===TODAY;
          const isHol = isHolidayFn(d);
          const isSun = dow===0; const isSat = dow===6;
          const colColor = isSun||isHol?"#EF4444":isSat?A.main:"#94A3B8";
          const headBg = isT?"#FFF7ED":(isSun||isHol)?"#FFF5F5":isSat?"#F0F4FF":"transparent";
          return (
            <div key={d} style={{padding:"8px 6px",textAlign:"center",borderRight:"1px solid #E2E8F0",background:headBg,cursor:"pointer"}}
              onClick={()=>onDayClick(d)}>
              <div style={{fontSize:10,color:colColor,fontWeight:600,letterSpacing:".5px"}}>{DOW_ALL[dow]}</div>
              <div style={{fontSize:18,fontWeight:isT?700:400,color:isT?"#EA580C":isSun||isHol?"#EF4444":isSat?A.main:"#374151",marginTop:1}}>{d.slice(8)}</div>
              {isHol&&<div style={{fontSize:9,color:"#EF4444",fontWeight:600,lineHeight:1.2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:60,margin:"2px auto 0"}}>{holidayNameFn(d)}</div>}
            </div>
          );
        })}
      </div>
      {/* 予定カード列（スクロール可） */}
      <div style={{flex:1,display:"grid",gridTemplateColumns:"repeat(7,1fr)",overflowY:"auto",alignContent:"start"}}>
        {weekDays.map(d=>{
          const dow = new Date(d).getDay();
          const isT = d===TODAY;
          const isHol = isHolidayFn(d);
          const isSun = dow===0; const isSat = dow===6;
          const colBg = isT?"#FFFBF5":(isSun||isHol)?"#FFF8F8":isSat?"#F5F8FF":"#fff";
          const items = eventsOn(d).sort((a,b)=>a.time.localeCompare(b.time));
          return (
            <div key={d} style={{borderRight:"1px solid #E2E8F0",background:colBg,padding:"6px 5px",minHeight:160,cursor:"pointer"}}
              onClick={()=>onDayClick(d)}>
              {items.map(ev=>{
                const cat = ev.category?(eventCats.find(c=>c.id===ev.category)||{color:"#64748B",icon:"📅",label:""}):{color:"#94A3B8",icon:"📅",label:"未設定"};
                return (
                  <div key={ev.id}
                    onClick={e=>{e.stopPropagation();onEventClick(ev);}}
                    style={{marginBottom:8,padding:"10px 12px",borderRadius:8,
                      background:cat.color+"18",borderLeft:`4px solid ${cat.color}`,
                      cursor:"pointer",overflow:"hidden",
                      boxShadow:`0 1px 4px ${cat.color}33`}}>
                    <div style={{fontSize:12,fontWeight:700,color:cat.color,lineHeight:1.5}}>
                      {ev.time}{ev.timeEnd?`–${ev.timeEnd}`:""}
                    </div>
                    <div style={{fontSize:13,fontWeight:600,color:"#1E293B",lineHeight:1.5,marginTop:2,
                      overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
                      {cat.icon} {ev.title}
                    </div>
                    {ev.location&&<div style={{fontSize:10,color:cat.color,opacity:.8,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍{ev.location}</div>}
                  </div>
                );
              })}
              {/* 追加ボタン */}
              <div onClick={e=>{e.stopPropagation();onDayClick(d);}}
                style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"4px",borderRadius:5,
                  color:"#CBD5E1",fontSize:18,cursor:"pointer",opacity:.7,transition:"opacity .1s"}}
                onMouseEnter={e=>e.currentTarget.style.opacity=1}
                onMouseLeave={e=>e.currentTarget.style.opacity=.7}>
                ＋
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── WEEK VIEW ─── */
function WeekView({ weekDays, tasksOn, eventsOn, projOf, onSlotDblClick, onTaskClick, onEventClick, isHolidayFn, holidayNameFn, eventCats }) {
  const DOW_ALL = ["日","月","火","水","木","金","土"];
  const scrollRef = useRef(null);
  useEffect(() => {
    if(scrollRef.current) scrollRef.current.scrollTop = 8 * 2 * SLOT_H;
  }, []);
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden",background:"#fff",borderRadius:12,border:"1px solid #E2E8F0"}}>
      {/* ヘッダー+ボディ全体をひとつのスクロールエリアに */}
      <div ref={scrollRef} style={{overflowY:"scroll",flex:"1 1 0",minHeight:0}}>
        {/* 曜日ヘッダー - sticky固定 */}
        <div style={{display:"grid",gridTemplateColumns:"52px repeat(7,1fr)",borderBottom:"2px solid #E2E8F0",background:"#F8FAFC",position:"sticky",top:0,zIndex:3}}>
          <div style={{borderRight:"1px solid #E2E8F0"}}/>
          {weekDays.map(d => {
            const dow = new Date(d).getDay();
            const isT = d===TODAY;
            const isHol = isHolidayFn(d);
            const isSunD = dow===0;
            const isSatD = dow===6;
            const colColor = isSunD||isHol ? "#EF4444" : isSatD ? A.main : "#94A3B8";
            const colBg = isT ? "#FFF7ED" : (isSunD||isHol) ? "#FFF5F5" : isSatD ? "#F0F4FF" : "#F8FAFC";
            return (
              <div key={d} style={{padding:"8px 4px",textAlign:"center",borderRight:"1px solid #E2E8F0",background:colBg}}>
                <div style={{fontSize:10,color:colColor,fontWeight:600,letterSpacing:".5px"}}>{DOW_ALL[dow]}</div>
                <div style={{fontSize:16,fontWeight:isT?700:400,color:isT?"#EA580C":isSunD||isHol?"#EF4444":isSatD?A.main:"#374151",marginTop:2}}>{d.slice(8)}</div>
                {isHol&&<div style={{fontSize:9,color:"#EF4444",fontWeight:600,lineHeight:1.2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:60,margin:"2px auto 0",opacity:.85}}>{holidayNameFn(d)}</div>}
              </div>
            );
          })}
        </div>
        {/* 時間グリッド */}
        <div style={{display:"grid",gridTemplateColumns:"52px repeat(7,1fr)"}}>
          {/* time labels */}
          <div style={{borderRight:"1px solid #E2E8F0"}}>
            {HOURS.map(h => (
              <div key={h} style={{height:SLOT_H*2,borderTop:h===0?"none":"1.5px solid #E2E8F0",padding:"2px 6px 0",display:"flex",alignItems:"flex-start"}}>
                <span style={{fontSize:10,color:"#94A3B8",fontWeight:600,lineHeight:1}}>{pad(h)}:00</span>
              </div>
            ))}
          </div>

          {/* day columns */}
          {weekDays.map(d => {
            const dt = tasksOn(d).sort((a,b)=>a.time.localeCompare(b.time));
            const isT = d===TODAY;
            const dow = new Date(d).getDay();
            const isSunD = dow===0; const isSatD = dow===6;
            const isHol = isHolidayFn(d);
            const colBg = isT ? "#FFF7ED88" : (isSunD||isHol) ? "#FFF8F8" : isSatD ? "#F5F8FF" : "transparent";
            return (
              <div key={d} style={{borderRight:"1px solid #E2E8F0",position:"relative",background:colBg}}>
                {HOURS.flatMap(h => [0,30].map(min => {
                  const isHour = min===0;
                  const slotTime = `${pad(h)}:${pad(min)}`;
                  return (
                    <div key={slotTime} className="week-slot"
                      style={{height:SLOT_H,borderTop:isHour?(h===0?"none":"1.5px solid #CBD5E1"):"1px solid #F1F5F9"}}
                      onDoubleClick={()=>onSlotDblClick(d, slotTime)}
                    />
                  );
                }))}
                {(()=>{
                  // 予定+タスクを時間でレイアウト計算（重複を横分割）
                  const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
                  const allItems = [
                    ...eventsOn(d).map(ev=>({...ev,_kind:"event"}))
                  ].map(item=>({
                    ...item,
                    _start: toMin(item.time),
                    _end:   item.timeEnd && item.timeEnd>item.time ? toMin(item.timeEnd) : toMin(item.time)+30
                  })).sort((a,b)=>a._start-b._start);

                  // 重複グループで列割り当て
                  const cols = []; // cols[i] = 最後のendMin
                  allItems.forEach(item=>{
                    let col = cols.findIndex(endMin => endMin <= item._start);
                    if(col === -1){ col = cols.length; cols.push(0); }
                    cols[col] = item._end;
                    item._col = col;
                    item._totalCols = 1; // 後で更新
                  });
                  // 同じ時間帯に重なるアイテムの totalCols を揃える
                  allItems.forEach(a=>{
                    let max = 0;
                    allItems.forEach(b=>{
                      if(b._start < a._end && b._end > a._start) max = Math.max(max, b._col);
                    });
                    a._totalCols = max + 1;
                  });

                  return allItems.map(item=>{
                    const topPx  = (item._start / 30) * SLOT_H;
                    const heightPx = Math.max(SLOT_H, ((item._end - item._start) / 30) * SLOT_H) - 2;
                    const colW   = 100 / item._totalCols;
                    const leftPct  = item._col * colW;
                    const GUTTER = 3;

                    if(item._kind==="event"){
                      const cat = item.category ? (eventCats.find(c=>c.id===item.category)||{label:"",color:"#64748B",icon:"📅"}) : {label:"未設定",color:"#94A3B8",icon:"📅"};
                      return (
                        <div key={item.id} onClick={()=>onEventClick(item)}
                          style={{position:"absolute",
                            top:topPx,
                            left:`calc(${leftPct}% + ${GUTTER}px)`,
                            width:`calc(${colW}% - ${GUTTER*2}px)`,
                            height:heightPx,
                            padding:"4px 7px",borderRadius:6,background:cat.color+"18",
                            borderLeft:`3px solid ${cat.color}`,cursor:"pointer",zIndex:2,
                            boxShadow:`0 1px 6px ${cat.color}22`,overflow:"hidden"}}>
                          <div style={{fontSize:10,fontWeight:700,color:cat.color,lineHeight:1.3}}>
                            {cat.icon} {item.time}{item.timeEnd?` – ${item.timeEnd}`:""}
                          </div>
                          <div style={{fontSize:11,fontWeight:600,color:"#1E293B",lineHeight:1.3,marginTop:1,
                            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.title}</div>
                          {item.location&&heightPx>SLOT_H*2&&<div style={{fontSize:10,color:cat.color,opacity:.8,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍{item.location}</div>}
                        </div>
                      );
                    } else {
                      const p = projOf(item.project);
                      const col = p ? p.color : "#64748B";
                      return (
                        <div key={item.id} onClick={()=>onTaskClick(item)}
                          style={{position:"absolute",
                            top:topPx,
                            left:`calc(${leftPct}% + ${GUTTER}px)`,
                            width:`calc(${colW}% - ${GUTTER*2}px)`,
                            height:heightPx,
                            padding:"3px 6px",borderRadius:5,background:col+"18",
                            borderLeft:`2.5px solid ${col}`,cursor:"pointer",zIndex:1,
                            boxShadow:"0 1px 4px rgba(0,0,0,.08)",overflow:"hidden"}}>
                          <div style={{fontSize:10,fontWeight:700,color:col}}>
                            {item.time}{item.timeEnd?` – ${item.timeEnd}`:""}
                          </div>
                          <div style={{fontSize:10,color:"#374151",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.title}</div>
                        </div>
                      );
                    }
                  });
                })()}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function AuthScreen() {
  const [mode,     setMode]     = React.useState("login");
  const [email,    setEmail]    = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error,    setError]    = React.useState("");
  const [loading,  setLoading]  = React.useState(false);
  const auth = firebase.auth();

  const handleEmail = async () => {
    if (!email.trim() || !password) { setError("メールアドレスとパスワードを入力してください"); return; }
    setLoading(true); setError("");
    try {
      if (mode === "login") {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      } else {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (e) {
      const MSG = {
        "auth/user-not-found":       "メールアドレスが登録されていません",
        "auth/wrong-password":        "パスワードが間違っています",
        "auth/invalid-email":         "メールアドレスの形式が正しくありません",
        "auth/email-already-in-use":  "このメールアドレスは既に使用されています",
        "auth/weak-password":         "パスワードは6文字以上で入力してください",
        "auth/invalid-credential":    "メールアドレスまたはパスワードが正しくありません",
        "auth/too-many-requests":     "試行回数が多すぎます。しばらくしてから再試行してください",
      };
      setError(MSG[e.code] || e.message);
    }
    setLoading(false);
  };

  const handleGoogle = async () => {
    setLoading(true); setError("");
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    } catch (e) {
      if (e.code !== "auth/popup-closed-by-user") setError(e.message);
    }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F0F4F8",fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"#fff",borderRadius:16,padding:40,width:400,maxWidth:"95vw",boxShadow:"0 20px 60px rgba(0,0,0,.12)"}} className="fade">
        <div style={{textAlign:"center",marginBottom:28}}>

            {mode==="login" ? "アカウントにサインイン" : "新しいアカウントを作成"}

        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <div className="lbl" style={{marginBottom:4}}>メールアドレス</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="email@example.com" style={{width:"100%"}}
              onKeyDown={e=>e.key==="Enter"&&handleEmail()} autoFocus/>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:4}}>パスワード</div>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)}

          <button className="btn" onClick={handleEmail} disabled={loading}

              width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,
              opacity:loading?0.6:1,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <svg width="18" height="18" viewBox="0 0 48 48">

              <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C41.4 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-3.9z"/>

function App() {

  const [calDate,     setCalDate]     = useState({ year:todayObj.getFullYear(), month:todayObj.getMonth() });
  const [weekStart,   setWeekStart]   = useState(TODAY);

  const [showDone,    setShowDone]    = useState(false);

  const [eventCats, setEventCats] = useState([
    { id:"c1", label:"大会議室", color:"#6366F1", icon:"🏢" },
    { id:"c2", label:"小会議室", color:"#0891B2", icon:"🚪" },
